<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Presión</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #1f2937;
    }

    .contenedor {
      max-width: 600px;
      margin: auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
      color: #b91c1c;
      margin-bottom: 5px;
    }

    .subtitulo {
      text-align: center;
      color: #6b7280;
      margin-bottom: 25px;
    }

    .tarjeta {
      background: white;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    h2 {
      margin-top: 0;
      font-size: 20px;
    }

    label {
      display: block;
      margin-top: 14px;
      margin-bottom: 5px;
      font-weight: bold;
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      font-size: 17px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
    }

    textarea {
      resize: vertical;
      min-height: 70px;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #b91c1c;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    .ultima {
      text-align: center;
    }

    .presion {
      font-size: 42px;
      font-weight: bold;
      color: #b91c1c;
      margin: 10px 0;
    }

    .pulso {
      font-size: 18px;
      color: #4b5563;
    }

    .botones {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .secundario {
      background: #374151;
    }

    .sin-mediciones {
      color: #6b7280;
      text-align: center;
    }

    .panel {
      display: none;
    }

    .registro {
      padding: 15px 0;
      border-bottom: 1px solid #e5e7eb;
    }

    .registro:last-child {
      border-bottom: none;
    }

    .registro-presion {
      font-size: 22px;
      font-weight: bold;
      color: #b91c1c;
    }

    .registro-datos {
      margin-top: 5px;
      color: #4b5563;
    }

    .registro-observacion {
      margin-top: 6px;
      color: #6b7280;
      font-size: 14px;
    }

    .estado {
      text-align: center;
      font-size: 14px;
      color: #6b7280;
      margin-top: 10px;
    }

    .ok { color: #15803d; }
    .error { color: #b91c1c; }

    .resumen {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }

    .dato-resumen {
      background: #f9fafb;
      border-radius: 10px;
      padding: 12px;
      text-align: center;
    }

    .dato-resumen strong {
      display: block;
      font-size: 20px;
      color: #b91c1c;
    }
  </style>
</head>

<body>

<div class="contenedor">

  <h1>❤️ Mi Presión</h1>
  <div class="subtitulo">Registro personal de presión arterial</div>

  <div class="tarjeta ultima">
    <h2>Última medición</h2>

    <div id="ultimaMedicion">
      <div class="sin-mediciones">
        Cargando mediciones...
      </div>
    </div>
  </div>

  <div class="tarjeta">

    <h2>Nueva medición</h2>

    <label>Fecha</label>
    <input type="date" id="fecha">

    <label>Hora</label>
    <input type="time" id="hora">

    <label>Presión sistólica (máxima)</label>
    <input type="number" id="sistolica" placeholder="Ej: 120">

    <label>Presión diastólica (mínima)</label>
    <input type="number" id="diastolica" placeholder="Ej: 80">

    <label>Pulso</label>
    <input type="number" id="pulso" placeholder="Ej: 70">

    <label>Observación</label>
    <textarea
      id="observacion"
      placeholder="Ej: 5 minutos de reposo, recién levantado..."
    ></textarea>

    <button id="btnGuardar">
      Guardar medición
    </button>

    <div id="estado" class="estado"></div>

  </div>

  <div class="tarjeta">

    <h2>Mis registros</h2>

    <div class="botones">
      <button id="btnHistorial" class="secundario">
        📋 Historial
      </button>

      <button id="btnInformes" class="secundario">
        📊 Informes
      </button>
    </div>

  </div>

  <div id="panelHistorial" class="tarjeta panel">
    <h2>📋 Historial</h2>
    <div id="listaHistorial"></div>
  </div>

  <div id="panelInformes" class="tarjeta panel">
    <h2>📊 Informes</h2>
    <div id="contenidoInforme"></div>
  </div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";

import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";


// ========================================
// FIREBASE
// ========================================

const firebaseConfig = {
  apiKey: "AIzaSyDwES-u2Jm3zyhW_LqXCbLW-aoII38wjPU",
  authDomain: "mi-presion-4286e.firebaseapp.com",
  projectId: "mi-presion-4286e",
  storageBucket: "mi-presion-4286e.firebasestorage.app",
  messagingSenderId: "869630737307",
  appId: "1:869630737307:web:2aa3818c3475809450ff3e"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const medicionesRef = collection(db, "mediciones");

let mediciones = [];


// ========================================
// FECHA Y HORA
// ========================================

function completarFechaHora() {

  const ahora = new Date();

  const anio = ahora.getFullYear();
  const mes = String(ahora.getMonth() + 1).padStart(2, "0");
  const dia = String(ahora.getDate()).padStart(2, "0");

  const hora = String(ahora.getHours()).padStart(2, "0");
  const minutos = String(ahora.getMinutes()).padStart(2, "0");

  document.getElementById("fecha").value =
    `${anio}-${mes}-${dia}`;

  document.getElementById("hora").value =
    `${hora}:${minutos}`;
}

completarFechaHora();


// ========================================
// HISTORIAL INICIAL
// ========================================

const historicas = [

  ["2026-09-17","06:50",170,110,null,"Registro histórico"],
  ["2026-09-17","18:31",169,86,75,"Registro histórico"],
  ["2026-09-17","18:40",155,84,69,"Registro histórico"],
  ["2026-09-17","19:32",158,93,71,"Registro histórico"],

  ["2026-09-18","00:20",165,98,74,"Registro histórico"],
  ["2026-09-18","06:43",205,111,71,"Registro histórico"],
  ["2026-09-18","11:47",182,99,70,"Registro histórico"],
  ["2026-09-18","11:52",161,98,72,"Registro histórico"],

  ["2026-09-21","21:16",141,83,75,"Registro histórico"],
  ["2026-09-21","22:57",129,78,75,"Registro histórico"],

  ["2026-09-22","06:51",158,90,58,"Registro histórico"],

  ["2026-09-23","07:17",145,88,62,"Registro histórico"],
  ["2026-09-23","11:17",131,90,68,"Registro histórico"],
  ["2026-09-23","23:23",127,78,69,"Registro histórico"],

  ["2026-09-24","07:36",132,94,64,"Registro histórico"],

  ["2026-09-25","02:32",112,73,85,"Registro histórico"],
  ["2026-09-25","06:40",124,81,70,"Registro histórico"],
  ["2026-09-25","12:51",122,68,68,"Registro histórico"],
  ["2026-09-25","15:13",112,62,72,"Registro histórico"],

  ["2026-09-26","00:47",118,76,68,"Registro histórico"],

  ["2026-09-27","23:44",127,81,71,"Registro histórico"],

  ["2026-09-28","07:12",140,77,59,"Registro histórico"],
  ["2026-09-28","23:26",137,80,63,"Registro histórico"],

  ["2026-09-29","01:01",124,82,62,"Registro histórico"],
  ["2026-09-29","07:35",132,85,65,"Registro histórico"],
  ["2026-09-29","22:24",125,75,74,"Registro histórico"],

  ["2026-09-30","06:50",137,84,61,"Registro histórico"],

  ["2026-10-01","19:51",119,70,69,
   "Pulso 69 probable según fotografía."],

  ["2026-10-02","07:34",112,67,63,
   "Levantado 06:30. 5 minutos de reposo."]

];


// ========================================
// CARGAR HISTÓRICAS SOLO SI FIRESTORE
// ESTÁ VACÍO
// ========================================

async function cargarHistoricasSiHaceFalta() {

  const snapshot = await getDocs(medicionesRef);

  if (!snapshot.empty) {
    return;
  }

  for (const m of historicas) {

    await addDoc(medicionesRef, {

      fecha: m[0],
      hora: m[1],
      sistolica: m[2],
      diastolica: m[3],
      pulso: m[4],
      observacion: m[5],

      historica: true,
      creadoEn: serverTimestamp()

    });

  }

}


// ========================================
// CARGAR MEDICIONES
// SIN ORDERBY DE FIRESTORE
// ========================================

async function cargarMediciones() {

  try {

    const snapshot =
      await getDocs(medicionesRef);

    mediciones = [];

    snapshot.forEach((documento) => {

      mediciones.push({
        id: documento.id,
        ...documento.data()
      });

    });


    // Ordenamos en JavaScript.
    // Así evitamos necesitar índices de Firestore.

    mediciones.sort((a, b) => {

      const fechaA =
        `${a.fecha || ""} ${a.hora || ""}`;

      const fechaB =
        `${b.fecha || ""} ${b.hora || ""}`;

      return fechaB.localeCompare(fechaA);

    });


    mostrarUltima();
    mostrarHistorial();
    generarInforme();

  }

  catch (error) {

    console.error(
      "Error cargando mediciones:",
      error
    );

    document.getElementById(
      "ultimaMedicion"
    ).innerHTML = `

      <div class="sin-mediciones">
        No se pudieron cargar las mediciones.
      </div>

    `;

  }

}


// ========================================
// MOSTRAR ÚLTIMA
// ========================================

function mostrarUltima() {

  const contenedor =
    document.getElementById("ultimaMedicion");

  if (mediciones.length === 0) {

    contenedor.innerHTML = `

      <div class="sin-mediciones">
        Todavía no hay mediciones registradas.
      </div>

    `;

    return;

  }

  const m = mediciones[0];

  contenedor.innerHTML = `

    <div class="presion">
      ${m.sistolica} / ${m.diastolica}
    </div>

    <div class="pulso">
      ❤️ Pulso: ${m.pulso ?? "-"} lpm
    </div>

    <div style="margin-top:10px;color:#6b7280">
      ${formatearFecha(m.fecha)} - ${m.hora}
    </div>

    ${
      m.observacion
      ?
      `
        <div style="
          margin-top:10px;
          color:#6b7280;
          font-size:14px;
        ">
          ${m.observacion}
        </div>
      `
      :
      ""
    }

  `;

}


// ========================================
// GUARDAR
// ========================================

async function guardarMedicion() {

  const fecha =
    document.getElementById("fecha").value;

  const hora =
    document.getElementById("hora").value;

  const sistolica =
    Number(document.getElementById("sistolica").value);

  const diastolica =
    Number(document.getElementById("diastolica").value);

  const pulso =
    Number(document.getElementById("pulso").value);

  const observacion =
    document.getElementById("observacion").value.trim();


  if (
    !fecha ||
    !hora ||
    !sistolica ||
    !diastolica ||
    !pulso
  ) {

    alert(
      "Completá fecha, hora, presión y pulso."
    );

    return;
  }


  const boton =
    document.getElementById("btnGuardar");

  const estado =
    document.getElementById("estado");


  boton.disabled = true;
  boton.textContent = "Guardando...";


  try {

    await addDoc(medicionesRef, {

      fecha,
      hora,
      sistolica,
      diastolica,
      pulso,
      observacion,

      historica: false,

      creadoEn:
        serverTimestamp()

    });


    estado.textContent =
      "✓ Medición guardada";

    estado.className =
      "estado ok";


    document.getElementById("sistolica").value = "";
    document.getElementById("diastolica").value = "";
    document.getElementById("pulso").value = "";
    document.getElementById("observacion").value = "";


    completarFechaHora();

    await cargarMediciones();


    alert(
      "Medición guardada correctamente."
    );

  }

  catch (error) {

    console.error(
      "Error guardando:",
      error
    );

    estado.textContent =
      "No se pudo guardar.";

    estado.className =
      "estado error";

    alert(
      "No se pudo guardar la medición."
    );

  }

  finally {

    boton.disabled = false;

    boton.textContent =
      "Guardar medición";

  }

}


// ========================================
// HISTORIAL
// ========================================

function mostrarHistorial() {

  const lista =
    document.getElementById(
      "listaHistorial"
    );


  if (mediciones.length === 0) {

    lista.innerHTML = `

      <div class="sin-mediciones">
        No hay registros.
      </div>

    `;

    return;

  }


  lista.innerHTML =
    mediciones.map(m => `

      <div class="registro">

        <div class="registro-presion">

          ${m.sistolica} /
          ${m.diastolica} mmHg

        </div>

        <div class="registro-datos">

          📅 ${formatearFecha(m.fecha)}
          &nbsp;
          🕐 ${m.hora}

        </div>

        <div class="registro-datos">

          ❤️ Pulso:
          ${m.pulso ?? "-"} lpm

        </div>

        ${
          m.observacion
          ?
          `
            <div class="registro-observacion">
              ${m.observacion}
            </div>
          `
          :
          ""
        }

      </div>

    `).join("");

}


// ========================================
// INFORMES
// ========================================

function generarInforme() {

  const contenedor =
    document.getElementById(
      "contenidoInforme"
    );


  if (mediciones.length === 0) {

    contenedor.innerHTML =
      "Sin datos.";

    return;

  }


  const validas =
    mediciones.filter(
      m =>
        Number(m.sistolica) &&
        Number(m.diastolica)
    );


  const promedioSistolica =
    Math.round(
      validas.reduce(
        (total,m) =>
          total + Number(m.sistolica),
        0
      ) / validas.length
    );


  const promedioDiastolica =
    Math.round(
      validas.reduce(
        (total,m) =>
          total + Number(m.diastolica),
        0
      ) / validas.length
    );


  const conPulso =
    validas.filter(
      m => Number(m.pulso)
    );


  const promedioPulso =
    conPulso.length
    ?
    Math.round(
      conPulso.reduce(
        (total,m) =>
          total + Number(m.pulso),
        0
      ) / conPulso.length
    )
    :
    "-";


  const sistolicaMaxima =
    Math.max(
      ...validas.map(
        m => Number(m.sistolica)
      )
    );


  const sistolicaMinima =
    Math.min(
      ...validas.map(
        m => Number(m.sistolica)
      )
    );


  contenedor.innerHTML = `

    <div class="resumen">

      <div class="dato-resumen">

        <strong>
          ${promedioSistolica}/${promedioDiastolica}
        </strong>

        Presión promedio

      </div>


      <div class="dato-resumen">

        <strong>
          ${promedioPulso}
        </strong>

        Pulso promedio

      </div>


      <div class="dato-resumen">

        <strong>
          ${sistolicaMaxima}
        </strong>

        Sistólica máxima

      </div>


      <div class="dato-resumen">

        <strong>
          ${sistolicaMinima}
        </strong>

        Sistólica mínima

      </div>

    </div>


    <div style="
      text-align:center;
      margin-top:15px;
      color:#6b7280;
    ">

      Total:
      ${validas.length}
      mediciones

    </div>

  `;

}


// ========================================
// FORMATEAR FECHA
// ========================================

function formatearFecha(fecha) {

  if (!fecha) {
    return "";
  }

  const partes =
    fecha.split("-");

  if (partes.length !== 3) {
    return fecha;
  }

  return (
    partes[2] +
    "/" +
    partes[1] +
    "/" +
    partes[0]
  );

}


// ========================================
// BOTONES
// ========================================

document.getElementById(
  "btnGuardar"
).addEventListener(
  "click",
  guardarMedicion
);


document.getElementById(
  "btnHistorial"
).addEventListener(
  "click",
  () => {

    const panel =
      document.getElementById(
        "panelHistorial"
      );

    panel.style.display =
      panel.style.display === "block"
      ? "none"
      : "block";

  }
);


document.getElementById(
  "btnInformes"
).addEventListener(
  "click",
  () => {

    const panel =
      document.getElementById(
        "panelInformes"
      );

    panel.style.display =
      panel.style.display === "block"
      ? "none"
      : "block";

  }
);


// ========================================
// INICIAR APP
// ========================================

async function iniciar() {

  try {

    await cargarHistoricasSiHaceFalta();

    await cargarMediciones();

  }

  catch (error) {

    console.error(
      "Error iniciando Mi Presión:",
      error
    );

    document.getElementById(
      "ultimaMedicion"
    ).innerHTML = `

      <div class="sin-mediciones">
        No se pudieron cargar las mediciones.
      </div>

    `;

  }

}


iniciar();

</script>

</body>
</html>
