<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#b91c1c">

<title>Mi Presión</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f7fb;
  color: #1f2937;
}

.contenedor {
  max-width: 600px;
  margin: auto;
  padding: 16px;
}

h1 {
  text-align: center;
  color: #b91c1c;
  margin-bottom: 5px;
}

.subtitulo {
  text-align: center;
  color: #6b7280;
  margin-bottom: 22px;
}

.tarjeta {
  background: white;
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 18px;
  box-shadow: 0 3px 12px rgba(0,0,0,.08);
}

h2 {
  margin-top: 0;
}

label {
  display: block;
  margin-top: 14px;
  margin-bottom: 5px;
  font-weight: bold;
}

input, textarea {
  width: 100%;
  padding: 12px;
  font-size: 17px;
  border: 1px solid #d1d5db;
  border-radius: 10px;
}

textarea {
  min-height: 70px;
  resize: vertical;
}

button {
  width: 100%;
  margin-top: 15px;
  padding: 14px;
  border: none;
  border-radius: 10px;
  background: #b91c1c;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: .55;
}

.azul {
  background: #2563eb;
}

.secundario {
  background: #374151;
}

.botones {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.ultima {
  text-align: center;
}

.presion {
  font-size: 42px;
  font-weight: bold;
  color: #b91c1c;
  margin: 10px 0;
}

.pulso {
  font-size: 18px;
  color: #4b5563;
}

.detalle {
  color: #6b7280;
  margin-top: 7px;
}

#fotoInput {
  display: none;
}

#preview {
  display: none;
  width: 100%;
  max-height: 400px;
  object-fit: contain;
  margin-top: 15px;
  border-radius: 12px;
}

.avisoFoto {
  margin-top: 10px;
  padding: 10px;
  border-radius: 10px;
  background: #eff6ff;
  color: #1e40af;
  font-size: 14px;
  display: none;
}

#panelHistorial,
#panelInformes {
  display: none;
}

.registro {
  padding: 14px 0;
  border-bottom: 1px solid #e5e7eb;
}

.registro:last-child {
  border-bottom: none;
}

.registroPresion {
  font-size: 22px;
  font-weight: bold;
  color: #b91c1c;
}

.resumen {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.resumenDato {
  background: #f9fafb;
  border-radius: 10px;
  padding: 13px;
  text-align: center;
}

.resumenDato strong {
  display: block;
  color: #b91c1c;
  font-size: 21px;
}

@media(max-width:450px) {
  .contenedor { padding: 10px; }
  .tarjeta { padding: 15px; }
}
</style>
</head>

<body>

<div class="contenedor">

<h1>❤️ Mi Presión</h1>

<div class="subtitulo">
Registro personal de presión arterial
</div>


<div class="tarjeta ultima">

<h2>Última medición</h2>

<div id="ultimaMedicion">
Cargando...
</div>

</div>


<div class="tarjeta">

<h2>Nueva medición</h2>


<button
  type="button"
  class="azul"
  id="btnFoto">
📷 Sacar / elegir foto
</button>

<input
  type="file"
  id="fotoInput"
  accept="image/*"
  capture="environment">

<img id="preview">

<div id="avisoFoto" class="avisoFoto">
📷 Foto cargada. Por ahora verificá la pantalla y completá los tres valores manualmente.
</div>


<label>Fecha</label>
<input type="date" id="fecha">


<label>Hora</label>
<input type="time" id="hora">


<label>Presión sistólica (máxima)</label>

<input
  type="number"
  id="sistolica"
  inputmode="numeric"
  placeholder="Ej: 120">


<label>Presión diastólica (mínima)</label>

<input
  type="number"
  id="diastolica"
  inputmode="numeric"
  placeholder="Ej: 80">


<label>Pulso</label>

<input
  type="number"
  id="pulso"
  inputmode="numeric"
  placeholder="Ej: 70">


<label>Observación</label>

<textarea
  id="observacion"
  placeholder="Ej: 5 minutos de reposo, recién levantado..."></textarea>


<button id="btnGuardar">
💾 Guardar medición
</button>

</div>


<div class="tarjeta">

<h2>Mis registros</h2>

<div class="botones">

<button
  type="button"
  class="secundario"
  id="btnHistorial">
📋 Historial
</button>

<button
  type="button"
  class="secundario"
  id="btnInformes">
📊 Informes
</button>

</div>

</div>


<div
  class="tarjeta"
  id="panelHistorial">

<h2>📋 Historial completo</h2>

<div id="listaHistorial"></div>

</div>


<div
  class="tarjeta"
  id="panelInformes">

<h2>📊 Informe</h2>

<div id="contenidoInforme"></div>

</div>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";

import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";


/* =====================================================
   FIREBASE
===================================================== */

const firebaseConfig = {

  apiKey:
  "AIzaSyDwES-u2Jm3zyhW_LqXCbLW-aoII38wjPU",

  authDomain:
  "mi-presion-4286e.firebaseapp.com",

  projectId:
  "mi-presion-4286e",

  storageBucket:
  "mi-presion-4286e.firebasestorage.app",

  messagingSenderId:
  "869630737307",

  appId:
  "1:869630737307:web:2aa3818c3475809450ff3e"
};


const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);

const medicionesRef =
collection(db,"mediciones");


/* =====================================================
   ELEMENTOS
===================================================== */

const fecha =
document.getElementById("fecha");

const hora =
document.getElementById("hora");

const sistolica =
document.getElementById("sistolica");

const diastolica =
document.getElementById("diastolica");

const pulso =
document.getElementById("pulso");

const observacion =
document.getElementById("observacion");

const fotoInput =
document.getElementById("fotoInput");

const preview =
document.getElementById("preview");

const avisoFoto =
document.getElementById("avisoFoto");

let mediciones = [];


/* =====================================================
   HISTÓRICO QUE YA TENÍAMOS
===================================================== */

const historicas = [

["2026-09-17","06:50",170,110,null,"Registro histórico"],

["2026-09-17","18:31",169,86,75,"Registro histórico"],
["2026-09-17","18:40",155,84,69,"Registro histórico"],
["2026-09-17","19:32",158,93,71,"Registro histórico"],

["2026-09-18","00:20",165,98,74,"Registro histórico"],
["2026-09-18","06:43",205,111,71,"Registro histórico"],
["2026-09-18","11:47",182,99,70,"Registro histórico"],
["2026-09-18","11:52",161,98,72,"Registro histórico"],

["2026-09-21","21:16",141,83,75,"Registro histórico"],
["2026-09-21","22:57",129,78,75,"Registro histórico"],

["2026-09-22","06:51",158,90,58,"Registro histórico"],

["2026-09-23","07:17",145,88,62,"Registro histórico"],
["2026-09-23","11:17",131,90,68,"Registro histórico"],
["2026-09-23","23:23",127,78,69,"Registro histórico"],

["2026-09-24","07:36",132,94,64,"Registro histórico"],

["2026-09-25","02:32",112,73,85,"Registro histórico"],
["2026-09-25","06:40",124,81,70,"Registro histórico"],
["2026-09-25","12:51",122,68,68,"Registro histórico"],
["2026-09-25","15:13",112,62,72,"Registro histórico"],

["2026-09-26","00:47",118,76,68,"Registro histórico"],

["2026-09-27","23:44",127,81,71,"Registro histórico"],

["2026-09-28","07:12",140,77,59,"Registro histórico"],
["2026-09-28","23:26",137,80,63,"Registro histórico"],

["2026-09-29","01:01",124,82,62,"Registro histórico"],
["2026-09-29","07:35",132,85,65,"Registro histórico"],
["2026-09-29","22:24",125,75,74,"Registro histórico"],

["2026-09-30","06:50",137,84,61,"Registro histórico"],

["2026-10-01","19:51",119,70,69,
"Pulso 69 probable según fotografía."],

["2026-10-02","07:34",112,67,63,
"Levantado 06:30. 5 minutos de reposo."]

];


/* =====================================================
   FECHA / HORA ACTUAL
===================================================== */

function fechaHoraActual(){

const ahora =
new Date();

const yyyy =
ahora.getFullYear();

const mm =
String(
ahora.getMonth()+1
).padStart(2,"0");

const dd =
String(
ahora.getDate()
).padStart(2,"0");

const hh =
String(
ahora.getHours()
).padStart(2,"0");

const min =
String(
ahora.getMinutes()
).padStart(2,"0");

fecha.value =
`${yyyy}-${mm}-${dd}`;

hora.value =
`${hh}:${min}`;

}

fechaHoraActual();


/* =====================================================
   FOTO
===================================================== */

document.getElementById(
"btnFoto"
).addEventListener(
"click",
function(){

fotoInput.value="";

preview.src="";
preview.style.display="none";

avisoFoto.style.display="none";

/*
IMPORTANTE:
Una foto nueva empieza una medición nueva.
*/

sistolica.value="";
diastolica.value="";
pulso.value="";

fechaHoraActual();

fotoInput.click();

});


fotoInput.addEventListener(
"change",
function(){

const archivo =
fotoInput.files[0];

if(!archivo)
return;

const url =
URL.createObjectURL(archivo);

preview.src =
url;

preview.style.display =
"block";

avisoFoto.style.display =
"block";

});


/* =====================================================
   IMPORTAR HISTÓRICAS SIN DUPLICAR
===================================================== */

async function importarHistoricas(){

const snapshot =
await getDocs(
medicionesRef
);

const existentes =
new Set();


snapshot.forEach(
doc=>{

const m =
doc.data();

const clave =
`${m.fecha}|${m.hora}|${m.sistolica}|${m.diastolica}`;

existentes.add(
clave
);

});


for(
const h of historicas
){

const clave =
`${h[0]}|${h[1]}|${h[2]}|${h[3]}`;


if(
existentes.has(clave)
)
continue;


await addDoc(
medicionesRef,
{

fecha:h[0],

hora:h[1],

fechaHora:
`${h[0]}T${h[1]}:00`,

sistolica:h[2],

diastolica:h[3],

pulso:h[4],

observacion:h[5],

historica:true,

creadoEn:
serverTimestamp()

}
);


existentes.add(
clave
);

}

}


/* =====================================================
   CARGAR TODAS
===================================================== */

async function cargarMediciones(){

const snapshot =
await getDocs(
medicionesRef
);

mediciones=[];


snapshot.forEach(
doc=>{

mediciones.push(
{
id:doc.id,
...doc.data()
}
);

});


mediciones.sort(
(a,b)=>{

const A =
`${a.fecha||""} ${a.hora||""}`;

const B =
`${b.fecha||""} ${b.hora||""}`;

return B.localeCompare(A);

}
);


mostrarUltima();

mostrarHistorial();

generarInforme();

}


/* =====================================================
   ÚLTIMA
===================================================== */

function mostrarUltima(){

const cont =
document.getElementById(
"ultimaMedicion"
);


if(
mediciones.length===0
){

cont.innerHTML =
"No hay mediciones.";

return;

}


const m =
mediciones[0];


cont.innerHTML = `

<div class="presion">
${m.sistolica} / ${m.diastolica}
</div>

<div class="pulso">
❤️ Pulso:
${m.pulso ?? "-"} lpm
</div>

<div class="detalle">

${formatearFecha(m.fecha)}

-

${m.hora || ""}

</div>

${
m.observacion
?
`
<div class="detalle">
${escaparHTML(m.observacion)}
</div>
`
:
""
}

`;

}


/* =====================================================
   GUARDAR NUEVA
===================================================== */

document.getElementById(
"btnGuardar"
).addEventListener(
"click",
guardarMedicion
);


async function guardarMedicion(){

const sis =
Number(
sistolica.value
);

const dia =
Number(
diastolica.value
);

const pul =
Number(
pulso.value
);


if(
!fecha.value ||
!hora.value ||
!sis ||
!dia ||
!pul
){

alert(
"Completá fecha, hora, sistólica, diastólica y pulso."
);

return;

}


if(
sis<50 ||
sis>300 ||
dia<30 ||
dia>200 ||
pul<30 ||
pul>220
){

alert(
"Revisá los valores antes de guardar."
);

return;

}


if(
sis<=dia
){

alert(
"Revisá la medición: la sistólica debe ser mayor que la diastólica."
);

return;

}


const confirmar =
confirm(

`Confirmá la medición:\n\n`+

`Presión: ${sis}/${dia}\n`+

`Pulso: ${pul} lpm\n`+

`Fecha: ${formatearFecha(fecha.value)}\n`+

`Hora: ${hora.value}\n\n`+

`¿Los valores son correctos?`

);


if(
!confirmar
)
return;


const boton =
document.getElementById(
"btnGuardar"
);


try{

boton.disabled=true;

boton.textContent =
"Guardando...";


await addDoc(
medicionesRef,
{

fecha:
fecha.value,

hora:
hora.value,

fechaHora:
`${fecha.value}T${hora.value}:00`,

sistolica:sis,

diastolica:dia,

pulso:pul,

observacion:
observacion.value.trim(),

historica:false,

creadoEn:
serverTimestamp()

}
);


alert(
"Medición guardada correctamente."
);


limpiarFormulario();

await cargarMediciones();


}catch(error){

console.error(error);

alert(
"No se pudo guardar la medición."
);

}finally{

boton.disabled=false;

boton.textContent =
"💾 Guardar medición";

}

}


/* =====================================================
   LIMPIAR
===================================================== */

function limpiarFormulario(){

sistolica.value="";
diastolica.value="";
pulso.value="";
observacion.value="";

fotoInput.value="";

preview.src="";
preview.style.display="none";

avisoFoto.style.display="none";

fechaHoraActual();

}


/* =====================================================
   HISTORIAL
===================================================== */

function mostrarHistorial(){

const lista =
document.getElementById(
"listaHistorial"
);


if(
mediciones.length===0
){

lista.innerHTML =
"No hay mediciones.";

return;

}


lista.innerHTML =

mediciones.map(
m=>`

<div class="registro">

<div class="registroPresion">

${m.sistolica}/${m.diastolica}
mmHg

</div>

<div>

❤️ Pulso:
${m.pulso ?? "-"} lpm

</div>

<div class="detalle">

📅
${formatearFecha(m.fecha)}

&nbsp;

🕐
${m.hora || ""}

</div>

${
m.observacion
?
`
<div class="detalle">
${escaparHTML(m.observacion)}
</div>
`
:
""
}

</div>

`
).join("");

}


/* =====================================================
   INFORME
===================================================== */

function generarInforme(){

const c =
document.getElementById(
"contenidoInforme"
);


const validas =
mediciones.filter(
m=>
Number(m.sistolica) &&
Number(m.diastolica)
);


if(
!validas.length
){

c.innerHTML =
"Sin datos.";

return;

}


const promedio =
campo => {

const datos =
validas.filter(
m=>Number(m[campo])
);

if(
!datos.length
)
return "-";


return Math.round(

datos.reduce(
(s,m)=>
s+Number(m[campo]),
0
)

/

datos.length

);

};


const maxSis =
Math.max(
...validas.map(
m=>Number(m.sistolica)
)
);


const minSis =
Math.min(
...validas.map(
m=>Number(m.sistolica)
)
);


c.innerHTML = `

<div class="resumen">

<div class="resumenDato">

<strong>
${promedio("sistolica")}/${promedio("diastolica")}
</strong>

Promedio presión

</div>


<div class="resumenDato">

<strong>
${promedio("pulso")}
</strong>

Pulso promedio

</div>


<div class="resumenDato">

<strong>
${maxSis}
</strong>

Sistólica máxima

</div>


<div class="resumenDato">

<strong>
${minSis}
</strong>

Sistólica mínima

</div>

</div>


<div
class="detalle"
style="text-align:center;margin-top:15px">

Total:
${validas.length}
mediciones

</div>

`;

}


/* =====================================================
   BOTONES
===================================================== */

document.getElementById(
"btnHistorial"
).addEventListener(
"click",
function(){

const panel =
document.getElementById(
"panelHistorial"
);

panel.style.display =
panel.style.display==="block"
?
"none"
:
"block";

}
);


document.getElementById(
"btnInformes"
).addEventListener(
"click",
function(){

const panel =
document.getElementById(
"panelInformes"
);

panel.style.display =
panel.style.display==="block"
?
"none"
:
"block";

}
);


/* =====================================================
   UTILIDADES
===================================================== */

function formatearFecha(f){

if(!f)
return "";

const p =
f.split("-");

if(
p.length!==3
)
return f;

return `${p[2]}/${p[1]}/${p[0]}`;

}


function escaparHTML(texto){

const div =
document.createElement(
"div"
);

div.textContent =
texto || "";

return div.innerHTML;

}


/* =====================================================
   INICIO
===================================================== */

async function iniciar(){

try{

fechaHoraActual();

/*
Primero recuperamos las históricas.
No duplica las que ya estén en Firebase.
*/

await importarHistoricas();

await cargarMediciones();

}catch(error){

console.error(error);

document.getElementById(
"ultimaMedicion"
).innerHTML =
"No se pudieron cargar las mediciones.";

}

}


iniciar();

</script>

</body>
</html>
