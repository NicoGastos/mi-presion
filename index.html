<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mi Presión</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #1f2937;
    }

    .contenedor {
      max-width: 600px;
      margin: auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
      color: #b91c1c;
      margin-bottom: 5px;
    }

    .subtitulo {
      text-align: center;
      color: #6b7280;
      margin-bottom: 25px;
    }

    .tarjeta {
      background: white;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    h2 {
      margin-top: 0;
      font-size: 20px;
    }

    label {
      display: block;
      margin-top: 14px;
      margin-bottom: 5px;
      font-weight: bold;
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      font-size: 17px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
    }

    textarea {
      resize: vertical;
      min-height: 70px;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #b91c1c;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .ultima {
      text-align: center;
    }

    .presion {
      font-size: 42px;
      font-weight: bold;
      color: #b91c1c;
      margin: 10px 0;
    }

    .pulso {
      font-size: 18px;
      color: #4b5563;
    }

    .botones {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .secundario {
      background: #374151;
    }

    .sin-mediciones {
      color: #6b7280;
      text-align: center;
    }

    .historial {
      display: none;
    }

    .registro {
      padding: 15px 0;
      border-bottom: 1px solid #e5e7eb;
    }

    .registro:last-child {
      border-bottom: none;
    }

    .registro-presion {
      font-size: 22px;
      font-weight: bold;
      color: #b91c1c;
    }

    .registro-datos {
      margin-top: 5px;
      color: #4b5563;
    }

    .registro-observacion {
      margin-top: 6px;
      color: #6b7280;
      font-size: 14px;
    }

    .estado {
      text-align: center;
      font-size: 14px;
      color: #6b7280;
      margin-top: 10px;
    }

    .ok {
      color: #15803d;
    }

    .error {
      color: #b91c1c;
    }

    .resumen {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }

    .dato-resumen {
      background: #f9fafb;
      border-radius: 10px;
      padding: 12px;
      text-align: center;
    }

    .dato-resumen strong {
      display: block;
      font-size: 20px;
      color: #b91c1c;
    }

    @media (max-width: 450px) {
      .contenedor {
        padding: 15px;
      }

      .presion {
        font-size: 38px;
      }
    }
  </style>
</head>

<body>

<div class="contenedor">

  <h1>❤️ Mi Presión</h1>
  <div class="subtitulo">
    Registro personal de presión arterial
  </div>

  <div class="tarjeta ultima">
    <h2>Última medición</h2>

    <div id="ultimaMedicion">

    </div>
  </div>


  <div class="tarjeta">

    <h2>Nueva medición</h2>

    <label>Fecha</label>
    <input type="date" id="fecha">

    <label>Hora</label>
    <input type="time" id="hora">

    <label>Presión sistólica (máxima)</label>
    <input
      type="number"
      id="sistolica"
      placeholder="Ej: 120"
      min="50"
      max="300"
    >

    <label>Presión diastólica (mínima)</label>
    <input
      type="number"
      id="diastolica"
      placeholder="Ej: 80"
      min="30"
      max="200"
    >

    <label>Pulso</label>
    <input
      type="number"
      id="pulso"
      placeholder="Ej: 70"
      min="30"
      max="220"
    >

    <label>Observación</label>

    <textarea
      id="observacion"
      placeholder="Ej: 5 minutos de reposo, recién levantado..."
    ></textarea>

    <button id="btnGuardar">
      Guardar medición
    </button>

    <div id="estado" class="estado"></div>

  </div>


  <div class="tarjeta">

    <h2>Mis registros</h2>

    <div class="botones">

      <button
        id="btnHistorial"
        class="secundario"
      >
        📋 Historial
      </button>

      <button
        id="btnInformes"
        class="secundario"
      >
        📊 Informes
      </button>

    </div>

  </div>


  <div
    id="panelHistorial"

  </div>


  <div
    id="panelInformes"
    class="tarjeta historial"
  >

    <h2>📊 Resumen</h2>

    <div id="contenidoInforme"></div>

  </div>

</div>

  // ==========================================
  // CARGAR HISTÓRICAS SOLO UNA VEZ
  // ==========================================

  async function cargarHistoricasSiHaceFalta() {

    try {

      const snapshot =
        await getDocs(medicionesRef);


      if (!snapshot.empty) {

        return;

      }


      for (const m of historicas) {

        await addDoc(medicionesRef, {

          ...m,

          historica: true,

          creadoEn: serverTimestamp()

        });

      }


      console.log(
        "Historial inicial cargado correctamente."
      );


    } catch (error) {

      console.error(
        "Error cargando historial inicial:",
        error
      );

    }

  }


  // ==========================================
  // LEER FIRESTORE
  // ==========================================

  async function cargarMediciones() {

    try {

      const q = query(
        medicionesRef,
        orderBy("fecha", "desc"),
        orderBy("hora", "desc")
      );


      const snapshot =
        await getDocs(q);


      mediciones = [];


      snapshot.forEach((doc) => {

        mediciones.push({

          id: doc.id,

          ...doc.data()

        });

      });


      mostrarUltima();

      mostrarHistorial();

      generarInforme();


    } catch (error) {

      console.error(error);


      document.getElementById(
        "ultimaMedicion"
      ).innerHTML = `

        <div class="sin-mediciones">
          No se pudieron cargar las mediciones.
        </div>

      `;

    }

  }

    if (mediciones.length === 0) {

      contenedor.innerHTML = `

        </div>

      return;

    const m = mediciones[0];


    contenedor.innerHTML = `

  // ==========================================
  // GUARDAR NUEVA MEDICIÓN
  // ==========================================

  async function guardarMedicion() {

    const sistolica =
      Number(
        document.getElementById(
          "sistolica"
        ).value
      );

    const diastolica =
      Number(
        document.getElementById(
          "diastolica"
        ).value
      );

    const pulso =
      Number(
        document.getElementById(
          "pulso"
        ).value
      );

    const fecha =
      document.getElementById(
        "fecha"
      ).value;

    const hora =
      document.getElementById(
        "hora"
      ).value;

    const observacion =
      document.getElementById(
        "observacion"
      ).value.trim();


    if (
      !fecha ||
      !hora ||
      !sistolica ||
      !diastolica ||
      !pulso
    ) {

      alert(
        "Completá fecha, hora, presión y pulso."
      );

      return;

    }


    if (
      sistolica < 50 ||
      sistolica > 300 ||
      diastolica < 30 ||
      diastolica > 200 ||
      pulso < 30 ||
      pulso > 220
    ) {

      alert(
        "Revisá los valores ingresados."
      );

      return;

    }


    const boton =
      document.getElementById(
        "btnGuardar"
      );

    const estado =
      document.getElementById(
        "estado"
      );


    boton.disabled = true;

    boton.textContent =
      "Guardando...";


    try {

      await addDoc(
        medicionesRef,
        {

          fecha,

          hora,

          sistolica,

          diastolica,

          pulso,

          observacion,

          historica: false,

          creadoEn:
            serverTimestamp()

        }
      );


      estado.textContent =
        "✓ Medición guardada en Firebase";

      estado.className =
        "estado ok";


      document.getElementById(
        "sistolica"
      ).value = "";

      document.getElementById(
        "diastolica"
      ).value = "";

      document.getElementById(
        "pulso"
      ).value = "";

      document.getElementById(
        "observacion"
      ).value = "";


      completarFechaHora();


      await cargarMediciones();


      alert(
        "Medición cargada correctamente."
      );


    } catch (error) {

      console.error(error);


      estado.textContent =
        "Error al guardar la medición.";

      estado.className =
        "estado error";


      alert(
        "No se pudo guardar. Revisaremos la configuración de Firebase."
      );

    } finally {

      boton.disabled = false;

      boton.textContent =
        "Guardar medición";

    }

  }

    if (mediciones.length === 0) {

      lista.innerHTML =

      return;

    lista.innerHTML =
      mediciones.map(m => `

        <div class="registro">

          <div class="registro-presion">

            ${m.sistolica} /
            ${m.diastolica} mmHg

          </div>

          <div class="registro-datos">

            📅 ${formatearFecha(m.fecha)}
            &nbsp;
            🕐 ${m.hora}

          </div>

          <div class="registro-datos">

            ❤️ Pulso:
            ${m.pulso ?? "-"} lpm

          </div>

          ${
            m.observacion
            ?
            `
              <div
                class="registro-observacion"
              >
                ${m.observacion}
              </div>
            `
            :
            ""
          }

        </div>

      `).join("");

  }


  // ==========================================
  // INFORME SIMPLE
  // ==========================================

  function generarInforme() {

    const contenedor =
      document.getElementById(
        "contenidoInforme"
      );


    if (mediciones.length === 0) {

      contenedor.innerHTML =
        '<div class="sin-mediciones">Sin datos suficientes.</div>';

      return;

    }


    const validas =
      mediciones.filter(
        m =>
          Number(m.sistolica) &&
          Number(m.diastolica)
      );


    const promedioSistolica =
      Math.round(
        validas.reduce(
          (total, m) =>
            total + Number(m.sistolica),
          0
        ) / validas.length
      );


    const promedioDiastolica =
      Math.round(
        validas.reduce(
          (total, m) =>
            total + Number(m.diastolica),
          0
        ) / validas.length
      );


    const conPulso =
      validas.filter(
        m => Number(m.pulso)
      );


    const promedioPulso =
      conPulso.length
      ?
      Math.round(
        conPulso.reduce(
          (total, m) =>
            total + Number(m.pulso),
          0
        ) / conPulso.length
      )
      :
      "-";


    const maxima =
      Math.max(
        ...validas.map(
          m => Number(m.sistolica)
        )
      );


    const minima =
      Math.min(
        ...validas.map(
          m => Number(m.sistolica)
        )
      );


    contenedor.innerHTML = `

      <div class="resumen">

        <div class="dato-resumen">

          <strong>
            ${promedioSistolica}/${promedioDiastolica}
          </strong>

          Promedio

        </div>

        <div class="dato-resumen">

          <strong>
            ${promedioPulso}
          </strong>

          Pulso promedio

        </div>

        <div class="dato-resumen">

          <strong>
            ${maxima}
          </strong>

          Sistólica máxima

        </div>

        <div class="dato-resumen">

          <strong>
            ${minima}
          </strong>

          Sistólica mínima

        </div>

      </div>

      <div
        style="
          margin-top:15px;
          color:#6b7280;
          text-align:center
        "
      >

        ${validas.length}
        mediciones registradas

      </div>

    `;

  }


  // ==========================================
  // FORMATO FECHA
  // ==========================================

  function formatearFecha(fecha) {

    if (!fecha) {
      return "";
    }


    const partes =
      fecha.split("-");


    if (partes.length !== 3) {
      return fecha;
    }


    return (
      partes[2] +
      "/" +
      partes[1] +
      "/" +
      partes[0]
    );

  }
