/* =========================================================
   FECHA Y HORA ACTUALES
========================================================= */

function fechaHoraActual() {

  const d = new Date();

  const yyyy =
  d.getFullYear();

  const mm =
  String(d.getMonth()+1).padStart(2,"0");

  const dd =
  String(d.getDate()).padStart(2,"0");

  const hh =
  String(d.getHours()).padStart(2,"0");

  const min =
  String(d.getMinutes()).padStart(2,"0");

  fecha.value =
  `${yyyy}-${mm}-${dd}`;

  hora.value =
  `${hh}:${min}`;
}

fechaHoraActual();


/* =========================================================
   CARGAR MEDICIONES
========================================================= */

async function cargarMediciones() {

  try {

    const q =
    query(
      ref,
      orderBy("fechaHora","desc")
    );

    const snap =
    await getDocs(q);

    mediciones = [];

    snap.forEach(d => {

      mediciones.push({
        id:d.id,
        ...d.data()
      });

    });

    mostrarUltima();
    mostrarHistorial();

  }

  catch(e) {

    console.error(e);

    document.getElementById(
      "ultimaMedicion"
    ).innerHTML =
    "No se pudieron cargar las mediciones.";

  }
}


/* =========================================================
   ÚLTIMA
========================================================= */

function mostrarUltima() {

  const cont =
  document.getElementById(
    "ultimaMedicion"
  );

  if(!mediciones.length) {

    cont.innerHTML =
    "Todavía no hay mediciones registradas.";

    return;
  }

  const m =
  mediciones[0];

  cont.innerHTML = `

    <div class="presion">
      ${m.sistolica} / ${m.diastolica}
    </div>

    <div class="pulso">
      ❤️ Pulso: ${m.pulso} lpm
    </div>

    <div class="detalle">
      ${formatearFecha(m.fecha)}
      -
      ${m.hora || ""}
    </div>

    ${
      m.observacion
      ?
      `<div class="detalle">
        ${escapeHTML(m.observacion)}
      </div>`
      :
      ""
    }

  `;
}


function formatearFecha(f) {

  if(!f)
  return "";

  const p =
  f.split("-");

  if(p.length !== 3)
  return f;

  return `${p[2]}/${p[1]}/${p[0]}`;
}


function escapeHTML(texto) {

  const d =
  document.createElement("div");

  d.textContent =
  texto || "";

  return d.innerHTML;
}

/* =========================================================
   PREPARAR FOTO
========================================================= */

function prepararImagen(img) {

  /*
    Conservamos buena resolución,
    pero evitamos imágenes gigantes.
  */

  let w =
  img.naturalWidth;

  let h =
  img.naturalHeight;

  const max =
  1400;


  if(w > max) {

    const factor =
    max / w;

    w =
    Math.round(w * factor);

    h =
    Math.round(h * factor);
  }


  canvasBase.width = w;
  canvasBase.height = h;


  const ctx =
  canvasBase.getContext(
    "2d",
    {
      willReadFrequently:true
    }
  );


  ctx.drawImage(
    img,
    0,
    0,
    w,
    h
  );
}


/* =========================================================
   OCR DE CADA FILA
========================================================= */

async function leerFila(
xP,
yP,
wP,
hP,
nombre,
minimo,
maximo
) {

  const x =
  Math.floor(
    canvasBase.width * xP
  );

  const y =
  Math.floor(
    canvasBase.height * yP
  );

  const w =
  Math.floor(
    canvasBase.width * wP
  );

  const h =
  Math.floor(
    canvasBase.height * hP
  );


  /*
    Probamos diferentes umbrales.

    Esto ayuda porque el LCD cambia
    bastante según iluminación/reflejos.
  */

  const umbrales =
  [105,125,145,165,185];


  let candidatos = [];


  for(
    const umbral
    of umbrales
  ) {

    crearZonaOCR(
      x,
      y,
      w,
      h,
      umbral
    );


    estado.innerHTML =
    `🔎 Leyendo ${nombre}...`;


    const resultado =
    await Tesseract.recognize(

      canvasOCR,

      "eng",

      {

        logger:
        m => {

          if(
            m.status ===
            "recognizing text"
          ) {

            const p =
            Math.round(
              (m.progress || 0)
              * 100
            );

            estado.innerHTML =
            `🔎 Leyendo ${nombre}: ${p}%`;

          }

        }

      }

    );


    const texto =
    resultado.data.text || "";


    const confianza =
    Number(
      resultado.data.confidence || 0
    );


    console.log(
      nombre,
      umbral,
      texto,
      confianza
    );


    const numeros =
    obtenerNumeros(
      texto,
      minimo,
      maximo
    );


    numeros.forEach(n => {

      candidatos.push({
        numero:n,
        confianza:confianza
      });

    });

  }


  /*
    Elegimos el número que apareció
    más veces entre los distintos
    tratamientos de la misma imagen.
  */

  return elegirCandidato(
    candidatos
  );
}


/* =========================================================
   CREAR IMAGEN DE ALTO CONTRASTE
========================================================= */

function crearZonaOCR(
x,
y,
w,
h,
umbral
) {

  const escala = 5;


  canvasOCR.width =
  w * escala;

  canvasOCR.height =
  h * escala;


  const ctx =
  canvasOCR.getContext(
    "2d",
    {
      willReadFrequently:true
    }
  );


  /*
    Fondo blanco.
  */

  ctx.fillStyle =
  "white";

  ctx.fillRect(
    0,
    0,
    canvasOCR.width,
    canvasOCR.height
  );


  ctx.imageSmoothingEnabled =
  true;


  ctx.drawImage(

    canvasBase,

    x,
    y,
    w,
    h,

    0,
    0,
    canvasOCR.width,
    canvasOCR.height

  );


  const img =
  ctx.getImageData(
    0,
    0,
    canvasOCR.width,
    canvasOCR.height
  );


  const data =
  img.data;


  for(
    let i=0;
    i<data.length;
    i+=4
  ) {

    const gris =

    data[i] * .299 +

    data[i+1] * .587 +

    data[i+2] * .114;


    /*
      Segmentos LCD oscuros = negro.
      Fondo = blanco.
    */

    const nuevo =
    gris < umbral
    ? 0
    : 255;


    data[i] =
    nuevo;

    data[i+1] =
    nuevo;

    data[i+2] =
    nuevo;

  }


  ctx.putImageData(
    img,
    0,
    0
  );
}


/* =========================================================
   EXTRAER NÚMEROS
========================================================= */

function obtenerNumeros(
texto,
minimo,
maximo
) {

  /*
    Algunas confusiones frecuentes
    del OCR con displays LCD.
  */

  let limpio =
  String(texto)
  .toUpperCase()
  .replace(/O/g,"0")
  .replace(/D/g,"0")
  .replace(/I/g,"1")
  .replace(/L/g,"1")
  .replace(/S/g,"5");


  /*
    Separamos secuencias numéricas.
  */

  const encontrados =
  limpio.match(/\d{2,3}/g)
  || [];


  let salida = [];


  encontrados.forEach(t => {

    const n =
    Number(t);

    if(
      n >= minimo &&
      n <= maximo
    ) {

      salida.push(n);

    }

  });


  /*
    Si Tesseract puso espacios
    entre los dígitos:
       "1 1 2"
    */

  const soloDigitos =
  limpio.replace(
    /[^0-9]/g,
    ""
  );


  if(
    soloDigitos.length >= 2 &&
    soloDigitos.length <= 3
  ) {

    const n =
    Number(soloDigitos);

    if(
      n >= minimo &&
      n <= maximo
    ) {

      salida.push(n);

    }

  }


  return [
    ...new Set(salida)
  ];
}


/* =========================================================
   VOTACIÓN DE RESULTADOS
========================================================= */

function elegirCandidato(lista) {

  if(!lista.length) {

    return {
      valor:"",
      votos:0
    };

  }


  const mapa = {};


  lista.forEach(c => {

    if(!mapa[c.numero]) {

      mapa[c.numero] = {
        votos:0,
        confianza:0
      };

    }

    mapa[c.numero].votos++;

    mapa[c.numero].confianza +=
    c.confianza;

  });


  let ganador = null;


  Object.keys(mapa)
  .forEach(numero => {

    const dato =
    mapa[numero];


    if(
      !ganador ||
      dato.votos >
      ganador.votos ||
      (
        dato.votos ===
        ganador.votos &&
        dato.confianza >
        ganador.confianza
      )
    ) {

      ganador = {

        valor:
        Number(numero),

        votos:
        dato.votos,

        confianza:
        dato.confianza

      };

    }

  });


  /*
    Queremos al menos dos coincidencias
    entre los tratamientos.

    Evita completar un valor basándonos
    en una única lectura dudosa.
  */

  if(
    !ganador ||
    ganador.votos < 2
  ) {

    return {
      valor:"",
      votos:
      ganador
      ?
      ganador.votos
      :
      0
    };

  }


  return ganador;
}


/* =========================================================
   GUARDAR
========================================================= */

guardar.addEventListener(
"click",
async function() {

  const sis =
  Number(sistolica.value);

  const dia =
  Number(diastolica.value);

  const pul =
  Number(pulso.value);


  if(
    !sis ||
    !dia ||
    !pul
  ) {

    alert(
      "Completá los tres valores."
    );

    return;
  }


  if(
    sis < 50 ||
    sis > 260 ||
    dia < 30 ||
    dia > 180 ||
    pul < 30 ||
    pul > 220
  ) {

    alert(
      "Alguno de los valores parece incorrecto. Revisalo."
    );

    return;
  }


  if(sis <= dia) {

    alert(
      "Revisá la lectura: la sistólica debe ser mayor que la diastólica."
    );

    return;
  }


  const ok =
  confirm(

    `Confirmá la medición:\n\n` +

    `Presión: ${sis}/${dia}\n` +

    `Pulso: ${pul} lpm\n\n` +

    `¿Los valores coinciden con el tensiómetro?`

  );


  if(!ok)
  return;


  try {

    guardar.disabled =
    true;

    guardar.textContent =
    "Guardando...";


    await addDoc(
      ref,
      {

        sistolica:sis,

        diastolica:dia,

        pulso:pul,

        fecha:
        fecha.value,

        hora:
        hora.value,

        fechaHora:
        `${fecha.value}T${hora.value}:00`,

        observacion:
        observacion.value.trim(),

        creadoEn:
        serverTimestamp()

      }
    );


    alert(
      "Medición guardada correctamente."
    );


    limpiar();

    await cargarMediciones();

  }

  catch(e) {

    console.error(e);

    alert(
      "No se pudo guardar la medición."
    );

  }

  finally {

    guardar.disabled =
    false;

    guardar.textContent =
    "Guardar medición";

  }

});


function limpiar() {

  sistolica.value = "";
  diastolica.value = "";
  pulso.value = "";

  observacion.value = "";

  archivoFoto.value = "";

  preview.style.display =
  "none";

  preview.src = "";

  estado.style.display =
  "none";

  aviso.style.display =
  "none";

  fechaHoraActual();

}

========================================================= */

document.getElementById(
"historial"
).addEventListener(
"click",
function() {

  const panel =
  document.getElementById(
    "historialPanel"
  );


  if(
    panel.style.display ===
    "block"
  ) {

    panel.style.display =
    "none";

  }

  else {

    mostrarHistorial();

    panel.style.display =
    "block";

    panel.scrollIntoView({
      behavior:"smooth"
    });

  }

});


function mostrarHistorial() {

  const lista =
  document.getElementById(
    "listaHistorial"
  );


  if(!mediciones.length) {

    lista.innerHTML =
    "No hay mediciones.";

    return;
  }


  lista.innerHTML =

  mediciones.map(
  m => `

    <div class="item">

      <div class="itemPresion">
        ${m.sistolica} / ${m.diastolica}
      </div>

      <div>
        ❤️ ${m.pulso} lpm
      </div>

      <div class="detalle">

        ${formatearFecha(m.fecha)}

        ${m.hora
          ?
          " - " + m.hora
          :
          ""
        }

      </div>

      ${
        m.observacion
        ?
        `<div class="detalle">
          ${escapeHTML(m.observacion)}
        </div>`
        :
        ""
      }

    </div>

  `).join("");

}


/* =========================================================
   INFORMES
========================================================= */

document.getElementById(
"informes"
).addEventListener(
"click",
function() {

  if(!mediciones.length) {

    alert(
      "Todavía no hay mediciones."
    );

    return;
  }


  const promedio = campo =>

  Math.round(

    mediciones.reduce(
      (s,m) =>
      s + Number(m[campo] || 0),
      0
    )

    /

    mediciones.length

  );


  alert(

    `Informe\n\n` +

    `Mediciones: ${mediciones.length}\n` +

    `Promedio: ` +

    `${promedio("sistolica")}/` +

    `${promedio("diastolica")}\n` +

    `Pulso promedio: ` +

    `${promedio("pulso")} lpm`

  );

});


/* =========================================================
   INICIO
========================================================= */

cargarMediciones();

</script>
