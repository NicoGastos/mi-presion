<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#c81e1e">

  <title>Mi Presión</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #111827;
    }

    .contenedor {
      max-width: 600px;
      margin: auto;
      padding: 16px;
    }

    h1 {
      text-align: center;
      color: #c81e1e;
      margin: 10px 0 4px;
    }

    .subtitulo {
      text-align: center;
      color: #6b7280;
      margin-bottom: 20px;
    }

    .tarjeta {
      background: white;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 3px 12px rgba(0,0,0,.08);
    }

    h2 {
      margin-top: 0;
      font-size: 20px;
    }

    label {
      display: block;
      margin-top: 14px;
      margin-bottom: 5px;
      font-weight: bold;
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      font-size: 17px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      background: white;
    }

    textarea {
      resize: vertical;
      min-height: 70px;
    }

    button {
      width: 100%;
      margin-top: 14px;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #c81e1e;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .55;
      cursor: default;
    }

    .secundario {
      background: #374151;
    }

    .fotoBtn {
      background: #2563eb;
    }

    .ultima {
      text-align: center;
    }

    .presion {
      font-size: 42px;
      font-weight: bold;
      color: #c81e1e;
      margin: 10px 0;
    }

    .pulso {
      font-size: 18px;
      color: #4b5563;
    }

    .fechaUltima,
    .obsUltima {
      margin-top: 8px;
      color: #6b7280;
    }

    .botones {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .sin-mediciones {
      color: #6b7280;
      text-align: center;
    }

    #archivoFoto {
      display: none;
    }

    #preview {
      width: 100%;
      max-height: 430px;
      object-fit: contain;
      border-radius: 12px;
      margin-top: 15px;
      display: none;
      background: #eee;
    }

    #estadoOCR {
      display: none;
      margin-top: 12px;
      padding: 12px;
      border-radius: 10px;
      background: #eff6ff;
      color: #1e40af;
      line-height: 1.4;
    }

    .advertencia {
      display: none;
      margin-top: 12px;
      padding: 12px;
      border-radius: 10px;
      background: #fff7ed;
      color: #9a3412;
      line-height: 1.4;
    }

    .ok {
      background: #ecfdf5 !important;
      color: #047857 !important;
    }

    .error {
      background: #fef2f2 !important;
      color: #b91c1c !important;
    }

    canvas {
      display: none;
    }

    .historialItem {
      padding: 13px 0;
      border-bottom: 1px solid #e5e7eb;
    }

    .historialItem:last-child {
      border-bottom: none;
    }

    .historialPresion {
      font-size: 22px;
      font-weight: bold;
      color: #b91c1c;
    }

    #panelHistorial {
      display: none;
    }

    @media (max-width: 450px) {
      .contenedor { padding: 10px; }
      .tarjeta { padding: 15px; }
      .presion { font-size: 38px; }
    }
  </style>
</head>

<body>

<div class="contenedor">

  <h1>❤️ Mi Presión</h1>
  <div class="subtitulo">Registro personal de presión arterial</div>

  <div class="tarjeta ultima">
    <h2>Última medición</h2>

    <div id="ultimaMedicion">
      <div class="sin-mediciones">
        Cargando mediciones...
      </div>
    </div>
  </div>


  <div class="tarjeta">

    <h2>Nueva medición</h2>

    <button type="button"
            class="fotoBtn"
            onclick="document.getElementById('archivoFoto').click()">
      📷 Sacar o elegir foto del tensiómetro
    </button>

    <input
      type="file"
      id="archivoFoto"
      accept="image/*"
      capture="environment"
    >

    <img id="preview" alt="Foto del tensiómetro">

    <div id="estadoOCR"></div>

    <div id="advertencia" class="advertencia">
      ⚠️ Revisá siempre los valores reconocidos antes de guardar.
    </div>

    <canvas id="canvasOriginal"></canvas>
    <canvas id="canvasZona"></canvas>


    <label>Fecha</label>
    <input type="date" id="fecha">

    <label>Hora</label>
    <input type="time" id="hora">

    <label>Presión sistólica (máxima)</label>
    <input
      type="number"
      id="sistolica"
      inputmode="numeric"
      placeholder="Ej: 120"
      min="50"
      max="260"
    >

    <label>Presión diastólica (mínima)</label>
    <input
      type="number"
      id="diastolica"
      inputmode="numeric"
      placeholder="Ej: 80"
      min="30"
      max="180"
    >

    <label>Pulso</label>
    <input
      type="number"
      id="pulso"
      inputmode="numeric"
      placeholder="Ej: 70"
      min="30"
      max="220"
    >

    <label>Observación</label>
    <textarea
      id="observacion"
      placeholder="Ej: 5 minutos de reposo, recién levantado..."
    ></textarea>

    <button id="btnGuardar" type="button">
      Guardar medición
    </button>

  </div>


  <div class="tarjeta">

    <h2>Mis registros</h2>

    <div class="botones">
      <button
        type="button"
        class="secundario"
        id="btnHistorial">
        📋 Historial
      </button>

      <button
        type="button"
        class="secundario"
        id="btnInformes">
        📊 Informes
      </button>
    </div>

  </div>


  <div class="tarjeta" id="panelHistorial">
    <h2>Historial</h2>
    <div id="listaHistorial"></div>
  </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>


<script type="module">

  import { initializeApp }
  from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

  import {
    getFirestore,
    collection,
    addDoc,
    getDocs,
    query,
    orderBy,
    serverTimestamp
  }
  from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


  /* ======================================================
     FIREBASE
     ====================================================== */

  const firebaseConfig = {
    apiKey: "AIzaSyDwES-u2Jm3zyhW_LqXCbLW-aoII38wjPU",
    authDomain: "mi-presion-4286e.firebaseapp.com",
    projectId: "mi-presion-4286e",
    storageBucket: "mi-presion-4286e.firebasestorage.app",
    messagingSenderId: "869630737307",
    appId: "1:869630737307:web:2aa3818c3475809450ff3e"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const medicionesRef = collection(db, "mediciones");


  /* ======================================================
     ELEMENTOS
     ====================================================== */

  const fecha = document.getElementById("fecha");
  const hora = document.getElementById("hora");

  const sistolica = document.getElementById("sistolica");
  const diastolica = document.getElementById("diastolica");
  const pulso = document.getElementById("pulso");
  const observacion = document.getElementById("observacion");

  const archivoFoto = document.getElementById("archivoFoto");
  const preview = document.getElementById("preview");

  const estadoOCR = document.getElementById("estadoOCR");
  const advertencia = document.getElementById("advertencia");

  const canvasOriginal =
    document.getElementById("canvasOriginal");

  const canvasZona =
    document.getElementById("canvasZona");

  const btnGuardar =
    document.getElementById("btnGuardar");

  const btnHistorial =
    document.getElementById("btnHistorial");

  const btnInformes =
    document.getElementById("btnInformes");

  const panelHistorial =
    document.getElementById("panelHistorial");

  const listaHistorial =
    document.getElementById("listaHistorial");


  let mediciones = [];


  /* ======================================================
     FECHA Y HORA ACTUALES
     IMPORTANTE:
     NO salen de la foto anterior.
     ====================================================== */

  function ponerFechaHoraActual() {

    const ahora = new Date();

    const yyyy = ahora.getFullYear();

    const mm =
      String(ahora.getMonth() + 1).padStart(2, "0");

    const dd =
      String(ahora.getDate()).padStart(2, "0");

    const hh =
      String(ahora.getHours()).padStart(2, "0");

    const min =
      String(ahora.getMinutes()).padStart(2, "0");

    fecha.value = `${yyyy}-${mm}-${dd}`;
    hora.value = `${hh}:${min}`;
  }


  ponerFechaHoraActual();


  /* ======================================================
     CARGAR FIREBASE
     ====================================================== */

  async function cargarMediciones() {

    try {

      const q = query(
        medicionesRef,
        orderBy("fechaHora", "desc")
      );

      const snapshot = await getDocs(q);

      mediciones = [];

      snapshot.forEach(doc => {

        mediciones.push({
          id: doc.id,
          ...doc.data()
        });

      });

      mostrarUltima();
      mostrarHistorial();

    } catch (error) {

      console.error(error);

      document.getElementById("ultimaMedicion").innerHTML = `
        <div class="sin-mediciones">
          No se pudieron cargar las mediciones.
        </div>
      `;
    }
  }


  /* ======================================================
     ÚLTIMA MEDICIÓN
     ====================================================== */

  function mostrarUltima() {

    const contenedor =
      document.getElementById("ultimaMedicion");

    if (mediciones.length === 0) {

      contenedor.innerHTML = `
        <div class="sin-mediciones">
          Todavía no hay mediciones registradas.
        </div>
      `;

      return;
    }

    const m = mediciones[0];

    contenedor.innerHTML = `

      <div class="presion">
        ${m.sistolica} / ${m.diastolica}
      </div>

      <div class="pulso">
        ❤️ Pulso: ${m.pulso} lpm
      </div>

      <div class="fechaUltima">
        ${formatearFecha(m.fecha)} - ${m.hora || ""}
      </div>

      ${
        m.observacion
        ? `<div class="obsUltima">${escaparHTML(m.observacion)}</div>`
        : ""
      }
    `;
  }


  function formatearFecha(valor) {

    if (!valor) return "";

    const partes = valor.split("-");

    if (partes.length !== 3)
      return valor;

    return `${partes[2]}/${partes[1]}/${partes[0]}`;
  }


  function escaparHTML(texto) {

    const div = document.createElement("div");
    div.textContent = texto || "";

    return div.innerHTML;
  }


  /* ======================================================
     GUARDAR
     ====================================================== */

  btnGuardar.addEventListener("click", guardarMedicion);


  async function guardarMedicion() {

    const sis = Number(sistolica.value);
    const dia = Number(diastolica.value);
    const pul = Number(pulso.value);

    if (!sis || !dia || !pul) {

      alert(
        "Completá sistólica, diastólica y pulso antes de guardar."
      );

      return;
    }

    if (
      sis < 50 || sis > 260 ||
      dia < 30 || dia > 180 ||
      pul < 30 || pul > 220
    ) {

      alert(
        "Alguno de los valores parece incorrecto. Revisalos antes de guardar."
      );

      return;
    }

    if (sis <= dia) {

      alert(
        "La presión sistólica debe ser mayor que la diastólica. Revisá los valores."
      );

      return;
    }

    const confirmar = confirm(
      `¿Guardar esta medición?\n\n` +
      `Presión: ${sis}/${dia}\n` +
      `Pulso: ${pul} lpm\n` +
      `Fecha: ${formatearFecha(fecha.value)}\n` +
      `Hora: ${hora.value}`
    );

    if (!confirmar)
      return;


    try {

      btnGuardar.disabled = true;
      btnGuardar.textContent = "Guardando...";


      const fechaHora =
        `${fecha.value}T${hora.value}:00`;


      await addDoc(medicionesRef, {

        sistolica: sis,
        diastolica: dia,
        pulso: pul,

        fecha: fecha.value,
        hora: hora.value,

        fechaHora: fechaHora,

        observacion:
          observacion.value.trim(),

        creadoEn:
          serverTimestamp()
      });


      alert("Medición guardada correctamente.");

      limpiarFormulario();

      await cargarMediciones();


    } catch (error) {

      console.error(error);

      alert(
        "No se pudo guardar la medición. Revisá la conexión o Firebase."
      );

    } finally {

      btnGuardar.disabled = false;
      btnGuardar.textContent = "Guardar medición";
    }
  }


  function limpiarFormulario() {

    sistolica.value = "";
    diastolica.value = "";
    pulso.value = "";
    observacion.value = "";

    archivoFoto.value = "";

    preview.src = "";
    preview.style.display = "none";

    estadoOCR.style.display = "none";
    advertencia.style.display = "none";

    ponerFechaHoraActual();
  }


  /* ======================================================
     FOTO
     ====================================================== */

  archivoFoto.addEventListener(
    "change",
    procesarFoto
  );


  async function procesarFoto(event) {

    const archivo =
      event.target.files[0];

    if (!archivo)
      return;


    /*
      Cada foto nueva comienza limpia.
      Evita que queden valores de una foto anterior.
    */

    sistolica.value = "";
    diastolica.value = "";
    pulso.value = "";

    ponerFechaHoraActual();


    const url =
      URL.createObjectURL(archivo);

    preview.src = url;
    preview.style.display = "block";

    advertencia.style.display = "block";


    estadoOCR.className = "";
    estadoOCR.style.display = "block";

    estadoOCR.textContent =
      "📷 Preparando la foto...";


    const imagen = new Image();

    imagen.onload = async function () {

      try {

        dibujarImagen(imagen);

        estadoOCR.textContent =
          "🔎 Buscando SYS, DIA y PULSE...";


        /*
          Para un Omron como el de tu foto,
          trabajamos principalmente con la
          zona central de la pantalla.

          Las coordenadas son porcentajes,
          por eso funcionan aunque la foto
          tenga distinta resolución.
        */


        const sys = await leerZona(
          0.35,
          0.27,
          0.35,
          0.22,
          "SYS"
        );


        const dia = await leerZona(
          0.35,
          0.43,
          0.35,
          0.22,
          "DIA"
        );


        const pul = await leerZona(
          0.40,
          0.58,
          0.30,
          0.18,
          "PULSE"
        );


        if (sys)
          sistolica.value = sys;

        if (dia)
          diastolica.value = dia;

        if (pul)
          pulso.value = pul;


        const completos =
          sistolica.value &&
          diastolica.value &&
          pulso.value;


        if (completos) {

          estadoOCR.className = "ok";

          estadoOCR.innerHTML =

            `✅ Valores detectados:<br><br>` +

            `<b>SYS:</b> ${sistolica.value}<br>` +

            `<b>DIA:</b> ${diastolica.value}<br>` +

            `<b>PULSE:</b> ${pulso.value}<br><br>` +

            `Revisalos contra la pantalla antes de guardar.`;

        } else {

          estadoOCR.className = "error";

          estadoOCR.innerHTML =

            `⚠️ No pude reconocer con seguridad los tres valores.<br><br>` +

            `Completá manualmente cualquier campo vacío y verificá todos los números antes de guardar.`;
        }


      } catch (error) {

        console.error(error);

        estadoOCR.className = "error";

        estadoOCR.innerHTML =
          "No pude leer automáticamente la foto. Podés completar los valores manualmente.";
      }


      URL.revokeObjectURL(url);
    };


    imagen.onerror = function () {

      estadoOCR.className = "error";

      estadoOCR.textContent =
        "No se pudo abrir la imagen.";

      URL.revokeObjectURL(url);
    };


    imagen.src = url;
  }


  /* ======================================================
     PREPARAR IMAGEN
     ====================================================== */

  function dibujarImagen(img) {

    const maxAncho = 1200;

    let ancho = img.naturalWidth;
    let alto = img.naturalHeight;


    if (ancho > maxAncho) {

      const escala =
        maxAncho / ancho;

      ancho = maxAncho;
      alto =
        Math.round(alto * escala);
    }


    canvasOriginal.width = ancho;
    canvasOriginal.height = alto;


    const ctx =
      canvasOriginal.getContext("2d", {
        willReadFrequently: true
      });


    ctx.drawImage(
      img,
      0,
      0,
      ancho,
      alto
    );
  }


  /* ======================================================
     LEER UNA ZONA
     ====================================================== */

  async function leerZona(
    xPorcentaje,
    yPorcentaje,
    anchoPorcentaje,
    altoPorcentaje,
    nombre
  ) {

    const x =
      Math.floor(
        canvasOriginal.width *
        xPorcentaje
      );

    const y =
      Math.floor(
        canvasOriginal.height *
        yPorcentaje
      );

    const w =
      Math.floor(
        canvasOriginal.width *
        anchoPorcentaje
      );

    const h =
      Math.floor(
        canvasOriginal.height *
        altoPorcentaje
      );


    /*
      Aumentamos mucho la zona para facilitar
      la lectura de los segmentos LCD.
    */

    const escala = 4;

    canvasZona.width =
      w * escala;

    canvasZona.height =
      h * escala;


    const ctx =
      canvasZona.getContext(
        "2d",
        { willReadFrequently: true }
      );


    ctx.imageSmoothingEnabled = true;


    ctx.drawImage(
      canvasOriginal,

      x,
      y,
      w,
      h,

      0,
      0,
      canvasZona.width,
      canvasZona.height
    );


    mejorarContraste(ctx);


    estadoOCR.textContent =
      `🔎 Leyendo ${nombre}...`;


    const resultado =
      await Tesseract.recognize(
        canvasZona,
        "eng",
        {
          logger: function(m) {

            if (
              m.status ===
              "recognizing text"
            ) {

              const porcentaje =
                Math.round(
                  (m.progress || 0) *
                  100
                );

              estadoOCR.textContent =
                `🔎 Leyendo ${nombre}: ${porcentaje}%`;
            }
          }
        }
      );


    const texto =
      resultado.data.text || "";


    console.log(
      nombre,
      "OCR:",
      texto
    );


    return extraerNumero(
      texto,
      nombre
    );
  }


  /* ======================================================
     CONTRASTE PARA DISPLAY LCD
     ====================================================== */

  function mejorarContraste(ctx) {

    const ancho =
      ctx.canvas.width;

    const alto =
      ctx.canvas.height;


    const imagen =
      ctx.getImageData(
        0,
        0,
        ancho,
        alto
      );


    const datos =
      imagen.data;


    for (
      let i = 0;
      i < datos.length;
      i += 4
    ) {

      const gris =
        0.299 * datos[i] +
        0.587 * datos[i + 1] +
        0.114 * datos[i + 2];


      /*
        Umbral pensado para hacer
        más visibles los segmentos oscuros.
      */

      const valor =
        gris < 145
        ? 0
        : 255;


      datos[i] = valor;
      datos[i + 1] = valor;
      datos[i + 2] = valor;
    }


    ctx.putImageData(
      imagen,
      0,
      0
    );
  }


  /* ======================================================
     LIMPIAR RESULTADO OCR
     ====================================================== */

  function extraerNumero(texto, tipo) {

    let limpio =
      String(texto)
        .replace(/[^\d]/g, "");


    if (!limpio)
      return "";


    /*
      Si aparecen caracteres extras,
      buscamos números con longitud lógica.
    */

    const candidatos = [];


    if (tipo === "SYS") {

      for (
        let longitud = 3;
        longitud >= 2;
        longitud--
      ) {

        for (
          let i = 0;
          i <= limpio.length - longitud;
          i++
        ) {

          const n =
            Number(
              limpio.substring(
                i,
                i + longitud
              )
            );


          if (
            n >= 70 &&
            n <= 250
          ) {

            candidatos.push(n);
          }
        }
      }

    } else if (tipo === "DIA") {

      for (
        let longitud = 3;
        longitud >= 2;
        longitud--
      ) {

        for (
          let i = 0;
          i <= limpio.length - longitud;
          i++
        ) {

          const n =
            Number(
              limpio.substring(
                i,
                i + longitud
              )
            );


          if (
            n >= 35 &&
            n <= 150
          ) {

            candidatos.push(n);
          }
        }
      }

    } else {

      for (
        let longitud = 3;
        longitud >= 2;
        longitud--
      ) {

        for (
          let i = 0;
          i <= limpio.length - longitud;
          i++
        ) {

          const n =
            Number(
              limpio.substring(
                i,
                i + longitud
              )
            );


          if (
            n >= 35 &&
            n <= 200
          ) {

            candidatos.push(n);
          }
        }
      }
    }


    if (candidatos.length === 0)
      return "";


    return candidatos[0];
  }


  /* ======================================================
     HISTORIAL
     ====================================================== */

  btnHistorial.addEventListener(
    "click",
    function () {

      if (
        panelHistorial.style.display ===
        "block"
      ) {

        panelHistorial.style.display =
          "none";

      } else {

        mostrarHistorial();

        panelHistorial.style.display =
          "block";

        panelHistorial.scrollIntoView({
          behavior: "smooth"
        });
      }
    }
  );


  function mostrarHistorial() {

    if (mediciones.length === 0) {

      listaHistorial.innerHTML =
        `<div class="sin-mediciones">
          No hay mediciones registradas.
        </div>`;

      return;
    }


    listaHistorial.innerHTML =
      mediciones.map(m => `

        <div class="historialItem">

          <div class="historialPresion">
            ${m.sistolica} / ${m.diastolica}
          </div>

          <div>
            ❤️ ${m.pulso} lpm
          </div>

          <div style="
            color:#6b7280;
            margin-top:4px;
          ">
            ${formatearFecha(m.fecha)}
            ${m.hora ? " - " + m.hora : ""}
          </div>

          ${
            m.observacion
            ? `
              <div style="
                margin-top:5px;
                color:#4b5563;
              ">
                ${escaparHTML(m.observacion)}
              </div>
            `
            : ""
          }

        </div>

      `).join("");
  }


  /* ======================================================
     INFORMES
     ====================================================== */

  btnInformes.addEventListener(
    "click",
    function () {

      if (mediciones.length === 0) {

        alert(
          "Todavía no hay mediciones para generar el informe."
        );

        return;
      }


      const promedioSis =
        Math.round(
          mediciones.reduce(
            (total, m) =>
              total +
              Number(m.sistolica || 0),
            0
          ) /
          mediciones.length
        );


      const promedioDia =
        Math.round(
          mediciones.reduce(
            (total, m) =>
              total +
              Number(m.diastolica || 0),
            0
          ) /
          mediciones.length
        );


      const promedioPulso =
        Math.round(
          mediciones.reduce(
            (total, m) =>
              total +
              Number(m.pulso || 0),
            0
          ) /
          mediciones.length
        );


      alert(
        `Informe actual\n\n` +
        `Mediciones: ${mediciones.length}\n` +
        `Promedio de presión: ${promedioSis}/${promedioDia}\n` +
        `Promedio de pulso: ${promedioPulso} lpm`
      );
    }
  );


  /* ======================================================
     ARRANQUE
     ====================================================== */

  cargarMediciones();

</script>

</body>
</html>
