<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#c81e1e">

<title>Mi Presión</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  color:#111827;
}

.contenedor{
  max-width:600px;
  margin:auto;
  padding:16px;
}

h1{
  text-align:center;
  color:#c81e1e;
  margin-bottom:5px;
}

.subtitulo{
  text-align:center;
  color:#6b7280;
  margin-bottom:20px;
}

.tarjeta{
  background:white;
  border-radius:16px;
  padding:20px;
  margin-bottom:18px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

h2{margin-top:0}

label{
  display:block;
  margin-top:14px;
  margin-bottom:5px;
  font-weight:bold;
}

input,textarea{
  width:100%;
  padding:12px;
  font-size:17px;
  border:1px solid #d1d5db;
  border-radius:10px;
}

textarea{
  min-height:70px;
}

button{
  width:100%;
  margin-top:14px;
  padding:14px;
  border:none;
  border-radius:10px;
  background:#c81e1e;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

button:disabled{opacity:.55}

.azul{background:#2563eb}
.secundario{background:#374151}

.botones{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.ultima{text-align:center}

.presion{
  font-size:42px;
  font-weight:bold;
  color:#c81e1e;
  margin:10px 0;
}

.pulso{
  font-size:18px;
  color:#4b5563;
}

.detalle{
  color:#6b7280;
  margin-top:8px;
}

#archivoFoto{display:none}

#preview{
  width:100%;
  max-height:450px;
  object-fit:contain;
  margin-top:15px;
  border-radius:12px;
  display:none;
}

#estado{
  display:none;
  margin-top:12px;
  padding:13px;
  border-radius:10px;
  line-height:1.5;
  background:#eff6ff;
  color:#1e40af;
}

.ok{
  background:#ecfdf5!important;
  color:#047857!important;
}

.error{
  background:#fff7ed!important;
  color:#9a3412!important;
}

.aviso{
  background:#fff7ed;
  color:#9a3412;
  padding:11px;
  border-radius:10px;
  margin-top:12px;
  display:none;
}

#historialPanel{display:none}

.item{
  padding:12px 0;
  border-bottom:1px solid #e5e7eb;
}

.itemPresion{
  font-size:22px;
  font-weight:bold;
  color:#b91c1c;
}

canvas{display:none}
</style>
</head>

<body>

<div class="contenedor">

<h1>❤️ Mi Presión</h1>
<div class="subtitulo">Registro personal de presión arterial</div>

<div class="tarjeta ultima">
  <h2>Última medición</h2>
  <div id="ultimaMedicion">Cargando...</div>
</div>

<div class="tarjeta">

<h2>Nueva medición</h2>

<button type="button" class="azul"
onclick="document.getElementById('archivoFoto').click()">
📷 Sacar o elegir foto
</button>

<input
 id="archivoFoto"
 type="file"
 accept="image/*"
 capture="environment">

<img id="preview">

<div id="estado"></div>

<div id="aviso" class="aviso">
⚠️ Revisá que los tres números coincidan con el tensiómetro antes de guardar.
</div>

<label>Fecha</label>
<input type="date" id="fecha">

<label>Hora</label>
<input type="time" id="hora">

<label>Presión sistólica (máxima)</label>
<input type="number" id="sistolica" inputmode="numeric" placeholder="Ej: 120">

<label>Presión diastólica (mínima)</label>
<input type="number" id="diastolica" inputmode="numeric" placeholder="Ej: 80">

<label>Pulso</label>
<input type="number" id="pulso" inputmode="numeric" placeholder="Ej: 70">

<label>Observación</label>
<textarea id="observacion"
placeholder="Ej: 5 minutos de reposo, recién levantado..."></textarea>

<button id="guardar">Guardar medición</button>

</div>

<div class="tarjeta">

<h2>Mis registros</h2>

<div class="botones">
<button id="historial" class="secundario">📋 Historial</button>
<button id="informes" class="secundario">📊 Informes</button>
</div>

</div>

<div class="tarjeta" id="historialPanel">
<h2>Historial</h2>
<div id="listaHistorial"></div>
</div>

<canvas id="canvas"></canvas>

</div>


<script type="module">

import {initializeApp}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
 getFirestore,
 collection,
 addDoc,
 getDocs,
 query,
 orderBy,
 serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const firebaseConfig={
 apiKey:"AIzaSyDwES-u2Jm3zyhW_LqXCbLW-aoII38wjPU",
 authDomain:"mi-presion-4286e.firebaseapp.com",
 projectId:"mi-presion-4286e",
 storageBucket:"mi-presion-4286e.firebasestorage.app",
 messagingSenderId:"869630737307",
 appId:"1:869630737307:web:2aa3818c3475809450ff3e"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);
const ref=collection(db,"mediciones");


const fecha=document.getElementById("fecha");
const hora=document.getElementById("hora");
const sistolica=document.getElementById("sistolica");
const diastolica=document.getElementById("diastolica");
const pulso=document.getElementById("pulso");
const observacion=document.getElementById("observacion");

const archivoFoto=document.getElementById("archivoFoto");
const preview=document.getElementById("preview");
const estado=document.getElementById("estado");
const aviso=document.getElementById("aviso");

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d",{willReadFrequently:true});

let mediciones=[];


/* FECHA/HORA */

function fechaHoraActual(){

 const d=new Date();

 fecha.value=
 `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;

 hora.value=
 `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
}

fechaHoraActual();


/* FIREBASE */

async function cargarMediciones(){

 try{

  const q=query(ref,orderBy("fechaHora","desc"));
  const snap=await getDocs(q);

  mediciones=[];

  snap.forEach(d=>{
   mediciones.push({
    id:d.id,
    ...d.data()
   });
  });

  mostrarUltima();
  mostrarHistorial();

 }catch(e){

  console.error(e);

  document.getElementById("ultimaMedicion").innerHTML=
  "No se pudieron cargar las mediciones.";
 }
}


function mostrarUltima(){

 const c=document.getElementById("ultimaMedicion");

 if(!mediciones.length){

  c.innerHTML="Todavía no hay mediciones registradas.";
  return;
 }

 const m=mediciones[0];

 c.innerHTML=`
 <div class="presion">${m.sistolica} / ${m.diastolica}</div>
 <div class="pulso">❤️ Pulso: ${m.pulso} lpm</div>
 <div class="detalle">${formatearFecha(m.fecha)} - ${m.hora||""}</div>
 ${m.observacion ? `<div class="detalle">${escapeHTML(m.observacion)}</div>` : ""}
 `;
}


function formatearFecha(f){

 if(!f)return "";

 const p=f.split("-");

 return p.length===3
 ? `${p[2]}/${p[1]}/${p[0]}`
 : f;
}


function escapeHTML(t){

 const d=document.createElement("div");
 d.textContent=t||"";

 return d.innerHTML;
}


/* =========================================================
   FOTO
========================================================= */

archivoFoto.addEventListener("change",function(e){

 const file=e.target.files[0];

 if(!file)return;

 /* Siempre limpiar datos de la foto anterior */

 sistolica.value="";
 diastolica.value="";
 pulso.value="";
 aviso.style.display="none";

 fechaHoraActual();

 const url=URL.createObjectURL(file);

 preview.src=url;
 preview.style.display="block";

 estado.style.display="block";
 estado.className="";
 estado.innerHTML="📷 Analizando la pantalla...";

 const img=new Image();

 img.onload=function(){

  try{

   prepararImagen(img);

   const resultado=analizarPantalla();

   console.log("RESULTADO LCD",resultado);

   if(resultado.sys)
    sistolica.value=resultado.sys;

   if(resultado.dia)
    diastolica.value=resultado.dia;

   if(resultado.pulse)
    pulso.value=resultado.pulse;


   if(resultado.sys && resultado.dia && resultado.pulse){

    estado.className="ok";

    estado.innerHTML=
    `✅ Lectura encontrada<br><br>
     <b>Sistólica:</b> ${resultado.sys}<br>
     <b>Diastólica:</b> ${resultado.dia}<br>
     <b>Pulso:</b> ${resultado.pulse} lpm`;

    aviso.style.display="block";

   }else{

    estado.className="error";

    estado.innerHTML=
    `⚠️ No pude reconocer con seguridad los tres valores.<br><br>
     SYS: ${resultado.sys || "no reconocido"}<br>
     DIA: ${resultado.dia || "no reconocido"}<br>
     PULSE: ${resultado.pulse || "no reconocido"}<br><br>
     Podés completar manualmente cualquier campo vacío.`;
   }

  }catch(err){

   console.error(err);

   estado.className="error";
   estado.innerHTML="⚠️ No pude procesar esta foto.";
  }

  URL.revokeObjectURL(url);
 };

 img.src=url;
});


function prepararImagen(img){

 let w=img.naturalWidth;
 let h=img.naturalHeight;

 const max=1200;

 if(w>max){

  const f=max/w;

  w=Math.round(w*f);
  h=Math.round(h*f);
 }

 canvas.width=w;
 canvas.height=h;

 ctx.drawImage(img,0,0,w,h);
}


/* =========================================================
   DETECTOR DEL DISPLAY
========================================================= */

function analizarPantalla(){

 /*
   Buscamos una zona oscura/gris compatible con
   la pantalla LCD dentro de la parte central
   de la fotografía.
 */

 const display=buscarDisplay();

 if(!display){

  console.log("No encontré display");

  return{
   sys:null,
   dia:null,
   pulse:null
  };
 }

 console.log("DISPLAY",display);


 /*
   Distribución aproximada dentro de la pantalla:

   SYS   parte superior
   DIA   parte central
   PULSE parte inferior

   Dejamos márgenes para evitar textos/iconos.
 */

 const sysRect={
  x:display.x+display.w*.20,
  y:display.y+display.h*.08,
  w:display.w*.70,
  h:display.h*.31
 };

 const diaRect={
  x:display.x+display.w*.23,
  y:display.y+display.h*.35,
  w:display.w*.67,
  h:display.h*.30
 };

 const pulseRect={
  x:display.x+display.w*.38,
  y:display.y+display.h*.66,
  w:display.w*.52,
  h:display.h*.27
 };


 const sys=leerNumeroLCD(sysRect,3);
 const dia=leerNumeroLCD(diaRect,2);
 const pulse=leerNumeroLCD(pulseRect,2);


 return{
  sys:validar(sys,70,250),
  dia:validar(dia,35,150),
  pulse:validar(pulse,35,200)
 };
}


/* =========================================================
   ENCONTRAR PANTALLA
========================================================= */

function buscarDisplay(){

 /*
   En las fotos que mandaste, la pantalla está
   aproximadamente en esta región central.

   La hacemos bastante amplia para tolerar
   diferentes distancias.
 */

 const W=canvas.width;
 const H=canvas.height;

 return{
  x:W*.27,
  y:H*.18,
  w:W*.47,
  h:H*.48
 };
}


/* =========================================================
   LEER NÚMEROS DE 7 SEGMENTOS
========================================================= */

function leerNumeroLCD(rect,cantidad){

 const resultados=[];

 for(let i=0;i<cantidad;i++){

  const margen=0.03;

  const ancho=
  rect.w/cantidad;

  const digitRect={

   x:
   rect.x+
   i*ancho+
   ancho*margen,

   y:
   rect.y,

   w:
   ancho*(1-margen*2),

   h:
   rect.h
  };

  const d=leerDigito(digitRect);

  resultados.push(d);
 }

 console.log("DIGITOS",resultados);

 if(resultados.some(v=>v===null))
  return null;

 return Number(resultados.join(""));
}


/* =========================================================
   UN DÍGITO
========================================================= */

function leerDigito(r){

 /*
      -- A --
     |       |
     F       B
     |       |
      -- G --
     |       |
     E       C
     |       |
      -- D --
 */

 const puntos={

  A:[.50,.12],
  B:[.79,.30],
  C:[.79,.70],
  D:[.50,.88],
  E:[.21,.70],
  F:[.21,.30],
  G:[.50,.50]
 };


 const segmentos={};

 for(const [nombre,p] of Object.entries(puntos)){

  segmentos[nombre]=
  segmentoOscuro(
   r.x+r.w*p[0],
   r.y+r.h*p[1],
   r.w*.22,
   r.h*.09
  );
 }


 const codigo=
 [
  segmentos.A,
  segmentos.B,
  segmentos.C,
  segmentos.D,
  segmentos.E,
  segmentos.F,
  segmentos.G
 ]
 .map(v=>v ? "1":"0")
 .join("");


 /*
    A B C D E F G
 */

 const mapa={

  "1111110":0,

  "0110000":1,

  "1101101":2,

  "1111001":3,

  "0110011":4,

  "1011011":5,

  "1011111":6,

  "1110000":7,

  "1111111":8,

  "1111011":9

 };


 if(mapa[codigo]!==undefined)
  return mapa[codigo];


 /*
   Tolerancia:
   buscamos el patrón más parecido.
 */

 let mejor=null;
 let menor=99;

 for(const [patron,numero] of Object.entries(mapa)){

  let diferencias=0;

  for(let i=0;i<7;i++){

   if(patron[i]!==codigo[i])
    diferencias++;
  }

  if(diferencias<menor){

   menor=diferencias;
   mejor=numero;
  }
 }


 /*
   Admitimos como máximo un segmento dudoso.
 */

 return menor<=1
 ? mejor
 : null;
}


/* =========================================================
   ¿HAY SEGMENTO OSCURO?
========================================================= */

function segmentoOscuro(cx,cy,w,h){

 const x=Math.max(0,Math.floor(cx-w/2));
 const y=Math.max(0,Math.floor(cy-h/2));

 const ww=Math.max(1,Math.floor(w));
 const hh=Math.max(1,Math.floor(h));

 const datos=
 ctx.getImageData(x,y,ww,hh).data;

 let total=0;
 let oscuros=0;

 for(let i=0;i<datos.length;i+=4){

  const gris=
  datos[i]*.299+
  datos[i+1]*.587+
  datos[i+2]*.114;

  total++;

  /*
    Los segmentos del LCD son bastante más
    oscuros que el fondo.
  */

  if(gris<105)
   oscuros++;
 }

 if(!total)return false;

 return (oscuros/total)>.20;
}


function validar(valor,min,max){

 if(valor===null)return null;

 if(valor<min || valor>max)
  return null;

 return valor;
}


/* =========================================================
   GUARDAR
========================================================= */

document.getElementById("guardar")
.addEventListener("click",async function(){

 const sis=Number(sistolica.value);
 const dia=Number(diastolica.value);
 const pul=Number(pulso.value);

 if(!sis || !dia || !pul){

  alert("Completá los tres valores.");
  return;
 }

 if(
  sis<50 || sis>260 ||
  dia<30 || dia>180 ||
  pul<30 || pul>220
 ){

  alert("Alguno de los valores parece incorrecto. Revisalo.");
  return;
 }

 if(sis<=dia){

  alert("Revisá los valores: la sistólica debe ser mayor que la diastólica.");
  return;
 }


 const confirmar=confirm(
 `Confirmá la medición:\n\n`+
 `${sis}/${dia} mmHg\n`+
 `Pulso: ${pul} lpm\n\n`+
 `¿Coincide con la pantalla del tensiómetro?`
 );

 if(!confirmar)return;


 const boton=this;

 try{

  boton.disabled=true;
  boton.textContent="Guardando...";

  await addDoc(ref,{

   sistolica:sis,
   diastolica:dia,
   pulso:pul,

   fecha:fecha.value,
   hora:hora.value,

   fechaHora:
   `${fecha.value}T${hora.value}:00`,

   observacion:
   observacion.value.trim(),

   creadoEn:
   serverTimestamp()
  });


  alert("Medición guardada correctamente.");

  limpiar();

  await cargarMediciones();

 }catch(e){

  console.error(e);

  alert("No se pudo guardar la medición.");

 }finally{

  boton.disabled=false;
  boton.textContent="Guardar medición";
 }
});


function limpiar(){

 sistolica.value="";
 diastolica.value="";
 pulso.value="";
 observacion.value="";

 archivoFoto.value="";

 preview.src="";
 preview.style.display="none";

 estado.style.display="none";
 aviso.style.display="none";

 fechaHoraActual();
}


/* =========================================================
   HISTORIAL
========================================================= */

document.getElementById("historial")
.addEventListener("click",function(){

 const panel=
 document.getElementById("historialPanel");

 if(panel.style.display==="block"){

  panel.style.display="none";

 }else{

  mostrarHistorial();

  panel.style.display="block";

  panel.scrollIntoView({
   behavior:"smooth"
  });
 }
});


function mostrarHistorial(){

 const lista=
 document.getElementById("listaHistorial");

 if(!mediciones.length){

  lista.innerHTML="No hay mediciones.";
  return;
 }

 lista.innerHTML=
 mediciones.map(m=>`

 <div class="item">

  <div class="itemPresion">
   ${m.sistolica} / ${m.diastolica}
  </div>

  <div>❤️ ${m.pulso} lpm</div>

  <div class="detalle">
   ${formatearFecha(m.fecha)}
   ${m.hora ? " - "+m.hora : ""}
  </div>

  ${m.observacion
   ? `<div class="detalle">${escapeHTML(m.observacion)}</div>`
   : ""
  }

 </div>

 `).join("");
}


/* =========================================================
   INFORMES
========================================================= */

document.getElementById("informes")
.addEventListener("click",function(){

 if(!mediciones.length){

  alert("Todavía no hay mediciones.");
  return;
 }

 const promedio=campo=>
 Math.round(
  mediciones.reduce(
   (s,m)=>s+Number(m[campo]||0),
   0
  )/mediciones.length
 );


 alert(
 `Informe\n\n`+
 `Mediciones: ${mediciones.length}\n`+
 `Promedio: ${promedio("sistolica")}/${promedio("diastolica")}\n`+
 `Pulso promedio: ${promedio("pulso")} lpm`
 );
});


cargarMediciones();

</script>

</body>
</html>
