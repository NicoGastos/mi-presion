body {

h1 {

  margin-bottom: 22px;

.tarjeta {

h2 { margin-top: 0; }

label {

  margin-bottom: 5px;

.azul { background: #2563eb; }

#fotoInput { display: none; }

}

#panelHistorial,

}

.registro {
  padding: 14px 0;

}

.registro:last-child {

.registroPresion {
  font-size: 22px;

.bloqueInforme {

  padding: 15px;
  background: #f9fafb;
  border-radius: 12px;
}

.bloqueInforme h3 {
  margin: 0 0 5px;
}

.resumen {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 12px;
}

.resumenDato {
  background: white;
  border-radius: 10px;
  padding: 12px;
  text-align: center;
}

.resumenDato strong {
  display: block;
  color: #b91c1c;

.evolucion {
  margin-top: 18px;
  padding: 16px;

  border-radius: 12px;
  line-height: 1.6;

.evolucion h3 {

  margin-top: 0;

.nota {
  margin-top: 15px;
  font-size: 13px;
  color: #6b7280;
  line-height: 1.5;

@media(max-width:450px) {

<script type="module">

/* =====================================================

const historicas = [

/* =====================================================
   FECHA / HORA ACTUAL
===================================================== */

function fechaHoraActual(){

const ahora =
new Date();

const yyyy =
ahora.getFullYear();

const mm =
String(
ahora.getMonth()+1
).padStart(2,"0");

const dd =
String(
ahora.getDate()
).padStart(2,"0");

const hh =
String(
ahora.getHours()
).padStart(2,"0");

const min =
String(
ahora.getMinutes()
).padStart(2,"0");

fecha.value =
`${yyyy}-${mm}-${dd}`;

hora.value =
`${hh}:${min}`;

}

fechaHoraActual();


/* =====================================================
   FOTO
===================================================== */

document.getElementById(
"btnFoto"
).addEventListener(
"click",
function(){

fotoInput.value="";

preview.src="";
preview.style.display="none";

avisoFoto.style.display="none";

sistolica.value="";
diastolica.value="";
pulso.value="";

fechaHoraActual();

fotoInput.click();

});


fotoInput.addEventListener(
"change",
function(){

const archivo =
fotoInput.files[0];

if(!archivo)
return;

const url =
URL.createObjectURL(archivo);

preview.src =
url;

preview.style.display =
"block";

avisoFoto.style.display =
"block";

});


/* =====================================================
   IMPORTAR HISTORICAS SIN DUPLICAR
===================================================== */

async function importarHistoricas(){

const snapshot =
await getDocs(
medicionesRef
);

const existentes =
new Set();


snapshot.forEach(
doc=>{

const m =
doc.data();

const clave =
`${m.fecha}|${m.hora}|${m.sistolica}|${m.diastolica}`;

existentes.add(
clave
);

});


for(
const h of historicas
){

const clave =
`${h[0]}|${h[1]}|${h[2]}|${h[3]}`;


if(
existentes.has(clave)
)
continue;


await addDoc(
medicionesRef,
{

fecha:h[0],

hora:h[1],

fechaHora:
`${h[0]}T${h[1]}:00`,

sistolica:h[2],

diastolica:h[3],

pulso:h[4],

observacion:h[5],

historica:true,

creadoEn:
serverTimestamp()

}
);


existentes.add(
clave
);

}

}


/* =====================================================
   CARGAR MEDICIONES
===================================================== */

async function cargarMediciones(){

const snapshot =
await getDocs(
medicionesRef
);

mediciones=[];


snapshot.forEach(
doc=>{

mediciones.push(
{
id:doc.id,
...doc.data()
}
);

});


mediciones.sort(
(a,b)=>{

const A =
`${a.fecha||""} ${a.hora||""}`;

const B =
`${b.fecha||""} ${b.hora||""}`;

return B.localeCompare(A);

}
);


mostrarUltima();

mostrarHistorial();

generarInforme();

}

   ULTIMA MEDICION
===================================================== */

const cont =
document.getElementById(
"ultimaMedicion"
);


if(
mediciones.length===0
){

cont.innerHTML =
"No hay mediciones.";

return;

}


const m =
mediciones[0];


cont.innerHTML = `

<div class="presion">
${m.sistolica} / ${m.diastolica}
</div>

<div class="pulso">
❤️ Pulso:
${m.pulso ?? "-"} lpm
</div>

<div class="detalle">

${formatearFecha(m.fecha)}

-

${m.hora || ""}

</div>

${
m.observacion
?
`
<div class="detalle">
${escaparHTML(m.observacion)}
</div>
`
:
""
}

`;

}


/* =====================================================
   GUARDAR NUEVA MEDICION
===================================================== */

document.getElementById(
"btnGuardar"
).addEventListener(
"click",
guardarMedicion
);


async function guardarMedicion(){

const sis =
Number(
sistolica.value
);

const dia =
Number(
diastolica.value
);

const pul =
Number(
pulso.value
);


if(
!fecha.value ||
!hora.value ||
!sis ||
!dia ||
!pul
){

alert(
"Completá fecha, hora, sistólica, diastólica y pulso."
);

return;

}


if(
sis<50 ||
sis>300 ||
dia<30 ||
dia>200 ||
pul<30 ||
pul>220
){

alert(
"Revisá los valores antes de guardar."
);

return;

}


if(
sis<=dia
){

alert(
"Revisá la medición: la sistólica debe ser mayor que la diastólica."
);

return;

}


const confirmar =
confirm(

`Confirmá la medición:\n\n`+

`Presión: ${sis}/${dia}\n`+

`Pulso: ${pul} lpm\n`+

`Fecha: ${formatearFecha(fecha.value)}\n`+

`Hora: ${hora.value}\n\n`+

`¿Los valores son correctos?`

);


if(
!confirmar
)
return;


const boton =
document.getElementById(
"btnGuardar"
);


try{

boton.disabled=true;

boton.textContent =
"Guardando...";


await addDoc(
medicionesRef,
{

fecha:
fecha.value,

hora:
hora.value,

fechaHora:
`${fecha.value}T${hora.value}:00`,

sistolica:sis,

diastolica:dia,

pulso:pul,

observacion:
observacion.value.trim(),

historica:false,

creadoEn:
serverTimestamp()

}
);


alert(
"Medición guardada correctamente."
);


limpiarFormulario();

await cargarMediciones();


}catch(error){

console.error(error);

alert(
"No se pudo guardar la medición."
);

}finally{

boton.disabled=false;

boton.textContent =
"💾 Guardar medición";

}

}

/* =====================================================
   CALCULOS DEL INFORME
===================================================== */

function calcularInforme(datos){

if(
!datos.length
)
return null;


const promedio =
campo => {

const valores =
datos.filter(
m =>
Number(m[campo])
);

if(
!valores.length
)
return null;


return Math.round(

valores.reduce(
(s,m)=>
s+Number(m[campo]),
0
)

/

valores.length

);

};


return {

cantidad:
datos.length,

sys:
promedio("sistolica"),

dia:
promedio("diastolica"),

pulso:
promedio("pulso"),

maxSys:
Math.max(
...datos.map(
m=>Number(m.sistolica)
)
),

minSys:
Math.min(
...datos.map(
m=>Number(m.sistolica)
)
),

maxDia:
Math.max(
...datos.map(
m=>Number(m.diastolica)
)
),

minDia:
Math.min(
...datos.map(
m=>Number(m.diastolica)
)
)

};

}


/* =====================================================
   BLOQUE VISUAL DEL INFORME
===================================================== */

function bloqueInforme(
titulo,
subtitulo,
datos
){

<div class="detalle">
${subtitulo}

</div>

${subtitulo}
</div>


<div class="resumen">


<div class="resumenDato">

<strong>
${datos.sys}/${datos.dia}
</strong>

Promedio

</div>


<div class="resumenDato">

<strong>
${datos.pulso ?? "-"}
</strong>

Pulso promedio

</div>


<div class="resumenDato">

<strong>
${datos.maxSys}/${datos.maxDia}
</strong>

Máximos registrados

</div>


<div class="resumenDato">

<strong>
${datos.minSys}/${datos.minDia}
</strong>

Mínimos registrados

</div>


</div>


<div
class="detalle"
style="text-align:center;margin-top:12px">

${datos.cantidad}
mediciones

</div>

</div>

`;

}


/* =====================================================
   INFORME GENERAL + ANTES/DESPUES
===================================================== */

function generarInforme(){

const c =
document.getElementById(
"contenidoInforme"
);


const validas =
mediciones.filter(
m=>
Number(m.sistolica) &&
Number(m.diastolica)
);


if(
!validas.length
){

c.innerHTML =
"Sin datos.";

return;

}


/*
=====================================================
PERIODOS

Antes:
17 y 18 de septiembre.

Inicio de Dilcoran:
19/09/2026.

Las mediciones registradas disponibles después
del inicio comienzan el 21/09.
=====================================================
*/

const antes =
validas.filter(
m=>
m.fecha < "2026-09-19"
);


const conMedicacion =
validas.filter(
m=>
m.fecha >= "2026-09-19"
);


const general =
calcularInforme(
validas
);

const previo =
calcularInforme(
antes
);

const tratamiento =
calcularInforme(
conMedicacion
);


let evolucion = "";


if(
previo &&
tratamiento
){

const diferenciaSys =
tratamiento.sys -
previo.sys;

const diferenciaDia =
tratamiento.dia -
previo.dia;

const diferenciaPulso =
tratamiento.pulso !== null &&
previo.pulso !== null
?
tratamiento.pulso -
previo.pulso
:
null;


const textoSys =
diferenciaSys < 0
?
`bajó ${Math.abs(diferenciaSys)} mmHg`
:
diferenciaSys > 0
?
`subió ${diferenciaSys} mmHg`
:
"no cambió";


const textoDia =
diferenciaDia < 0
?
`bajó ${Math.abs(diferenciaDia)} mmHg`
:
diferenciaDia > 0
?
`subió ${diferenciaDia} mmHg`
:
"no cambió";


const textoPulso =
diferenciaPulso === null
?
"No hay suficientes datos de pulso para comparar."
:
diferenciaPulso < 0
?
`El pulso promedio bajó ${Math.abs(diferenciaPulso)} lpm.`
:
diferenciaPulso > 0
?
`El pulso promedio subió ${diferenciaPulso} lpm.`
:
"El pulso promedio no cambió.";


evolucion = `

<div class="evolucion">

<h3>
📉 Comparación antes vs. con medicación
</h3>


Antes de Dilcoran:

<strong>
${previo.sys}/${previo.dia}
</strong>

mmHg.

<br>


Con Dilcoran:

<strong>
${tratamiento.sys}/${tratamiento.dia}
</strong>

mmHg.

<br><br>


La sistólica promedio
<strong>${textoSys}</strong>.

<br>

La diastólica promedio
<strong>${textoDia}</strong>.

<br>

${textoPulso}

</div>

`;

}


c.innerHTML = `

${bloqueInforme(
"📊 General",
"Todas las mediciones registradas",
general
)}


${bloqueInforme(
"⏮️ Antes de Dilcoran",
"17/09/2026 al 18/09/2026",
previo
)}


${bloqueInforme(
"💊 Con Dilcoran",
"Mediciones disponibles desde el inicio del tratamiento",
tratamiento
)}


${evolucion}

inicio de Dilcoran el 19/09/2026.

</div>

`;

}


/* =====================================================
   DESCARGAR PARA EXCEL
===================================================== */

document.getElementById(
"btnExcel"
).addEventListener(
"click",
descargarExcel
);


function descargarExcel(){

if(
!mediciones.length
){

alert(
"No hay mediciones para exportar."
);

return;

}


/*
Se genera CSV compatible con Excel.
Usamos punto y coma para que las columnas
se abran correctamente con configuración
regional argentina.
*/

let csv =

"Fecha;Hora;Sistolica;Diastolica;Pulso;Periodo;Observacion\n";


const ordenadas =
[...mediciones].sort(
(a,b)=>{

const A =
`${a.fecha||""} ${a.hora||""}`;

const B =
`${b.fecha||""} ${b.hora||""}`;

return A.localeCompare(B);

}
);


ordenadas.forEach(
m=>{

const periodo =
m.fecha < "2026-09-19"
?
"Antes de Dilcoran"
:
"Con Dilcoran";


const obs =
String(
m.observacion || ""
)
.replaceAll(
'"',
'""'
)
.replaceAll(
"\n",
" "
);


csv +=

`${formatearFecha(m.fecha)};` +

`${m.hora || ""};` +

`${m.sistolica || ""};` +

`${m.diastolica || ""};` +

`${m.pulso ?? ""};` +

`${periodo};` +

`"${obs}"\n`;

});


const blob =
new Blob(
[
"\uFEFF" + csv
],
{
type:
"text/csv;charset=utf-8;"
}
);


const url =
URL.createObjectURL(
blob
);


const enlace =
document.createElement(
"a"
);


enlace.href =
url;


enlace.download =
`mi-presion-${new Date()
.toISOString()
.slice(0,10)}.csv`;


document.body.appendChild(
enlace
);


enlace.click();


document.body.removeChild(
enlace
);


URL.revokeObjectURL(
url
);

}

/* =====================================================
   UTILIDADES
===================================================== */

function formatearFecha(f){

if(
!f
)
return "";


const p =
f.split("-");


if(
p.length!==3
)
return f;


return `${p[2]}/${p[1]}/${p[0]}`;

}


function escaparHTML(texto){

const div =
document.createElement(
"div"
);


div.textContent =
texto || "";


return div.innerHTML;

}
