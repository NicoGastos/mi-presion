<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Prueba lector - Mi Presión</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      margin: 0;
      padding: 20px;
    }

    .contenedor {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,.1);
    }

    h1 {
      text-align: center;
    }

    input {
      width: 100%;
      margin: 20px 0 8px 0;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 15px;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    #preview {
      display: none;
      width: 100%;
      max-height: 350px;
      object-fit: contain;
      margin: 15px 0;
      border-radius: 10px;
    }

    #infoArchivo {
      font-size: 13px;
      color: #6b7280;
      margin: 8px 0 15px 0;
      word-break: break-word;
    }

    #estado {
      margin-top: 20px;
      text-align: center;
      font-weight: bold;
    }

    #resultado {
      margin-top: 20px;
      padding: 15px;
      background: #f9fafb;
      border-radius: 10px;
      white-space: pre-wrap;
      display: none;
    }
  </style>
</head>

<body>

<div class="contenedor">

  <h1>📷 Lector de presión</h1>

  <p>
    Seleccioná una foto donde se vea claramente
    la pantalla del tensiómetro.
  </p>

  <input
    type="file"
    id="foto"
    accept="image/*"
  >

  <div id="infoArchivo"></div>

  <img id="preview">

  <button
    id="btnLeer"
    type="button"
    disabled>
    🤖 Leer presión
  </button>

  <div id="estado"></div>

  <div id="resultado"></div>

</div>


<script>

const WORKER_URL =
"https://mi-presion-lector.nbaraggiola.workers.dev/";

const foto =
document.getElementById("foto");

const preview =
document.getElementById("preview");

const infoArchivo =
document.getElementById("infoArchivo");

const btnLeer =
document.getElementById("btnLeer");

const estado =
document.getElementById("estado");

const resultado =
document.getElementById("resultado");


let archivoActual = null;
let base64Actual = null;
let previewURL = null;


// ==========================================
// SELECCIONAR FOTO
// ==========================================

foto.addEventListener(
  "change",
  async function(){

    archivoActual = null;
    base64Actual = null;

    resultado.style.display = "none";
    resultado.textContent = "";

    estado.innerHTML = "";

    btnLeer.disabled = true;

    infoArchivo.innerHTML = "";


    if(previewURL){

      URL.revokeObjectURL(previewURL);

      previewURL = null;

    }


    preview.removeAttribute("src");
    preview.style.display = "none";


    const archivo = foto.files[0];


    if(!archivo){

      return;

    }


    archivoActual = archivo;


    infoArchivo.innerHTML =
      "<strong>Archivo seleccionado:</strong><br>" +
      escaparHTML(archivo.name) +
      "<br>" +
      Math.round(archivo.size / 1024) +
      " KB" +
      "<br>" +
      escaparHTML(archivo.type || "tipo desconocido");


    previewURL =
      URL.createObjectURL(archivo);


    preview.src =
      previewURL;


    preview.style.display =
      "block";


    estado.innerHTML =
      "⏳ Preparando imagen...";


    try {

      base64Actual =
        await convertirBase64(archivoActual);


      estado.innerHTML =
        "✅ Foto lista para analizar";


      btnLeer.disabled =
        false;

    }

    catch(error){

      estado.innerHTML =
        "❌ No se pudo preparar la imagen";

      base64Actual =
        null;

    }

  }
);


// ==========================================
// ENVIAR FOTO
// ==========================================

btnLeer.addEventListener(
  "click",
  async function(){

    if(
      !archivoActual ||
      !base64Actual
    ){

      alert(
        "Seleccioná una foto primero."
      );

      return;

    }


    // Guardamos una copia exacta de la imagen
    // seleccionada para ESTA petición.

    const imagenAEnviar =
      base64Actual;


    btnLeer.disabled =
      true;


    estado.innerHTML =
      "🤖 Analizando imagen...";


    resultado.style.display =
      "none";


    resultado.textContent =
      "";


    try {

      const respuesta =
        await fetch(
          WORKER_URL,
          {

            method: "POST",

            cache: "no-store",

            headers: {

              "Content-Type":
                "application/json",

              "Cache-Control":
                "no-cache"

            },

            body: JSON.stringify({

              imagen:
                imagenAEnviar,

              prueba:
                Date.now()

            })

          }
        );


      const datos =
        await respuesta.json();


      if(!respuesta.ok){

        throw new Error(
          datos.error ||
          "Error del servicio"
        );

      }


      if(datos.ok === false){

        throw new Error(
          datos.error ||
          "No se pudo leer la medición"
        );

      }


      estado.innerHTML =
        "✅ Imagen analizada";


      resultado.style.display =
        "block";


      resultado.textContent =
        JSON.stringify(
          datos,
          null,
          2
        );

    }

    catch(error){

      estado.innerHTML =
        "❌ No se pudo analizar la imagen";


      resultado.style.display =
        "block";


      resultado.textContent =
        error.message;

    }


    btnLeer.disabled =
      false;

  }
);


// ==========================================
// CONVERTIR FOTO A BASE64
// ==========================================

function convertirBase64(archivo){

  return new Promise(
    function(resolve,reject){

      const lector =
        new FileReader();


      lector.onload =
        function(){

          resolve(
            lector.result
          );

        };


      lector.onerror =
        function(){

          reject(
            new Error(
              "Error leyendo la imagen"
            )
          );

        };


      lector.readAsDataURL(
        archivo
      );

    }
  );

}


// ==========================================
// SEGURIDAD PARA MOSTRAR NOMBRE DE ARCHIVO
// ==========================================

function escaparHTML(texto){

  return String(texto)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}

</script>

</body>
</html>
